function openFreeMo(){modalOpen=true;document.getElementById('freeModal').classList.add('on');document.getElementById('frName').value='';document.getElementById('frIni').value='';document.getElementById('frIniHint').textContent='';document.getElementById('frRole').value='Graphiste';document.getElementById('frPerm').checked=false;document.getElementById('frDatesRow').style.display='';document.getElementById('frStart').value=D();document.getElementById('frEnd').value='';var gF=freelances.filter(function(f){return(f.category||'graphiste')==='graphiste'});var seen={},uniq=[];gF.forEach(function(f){if(!seen[f.name]){seen[f.name]=1;uniq.push(f)}});document.getElementById('recallList').innerHTML=uniq.length?uniq.map(function(f){return '<div class="recall-item" data-rn="'+f.name+'" data-ri="'+f.ini+'" data-rr="'+(f.role||'Graphiste')+'"><span>👤</span><span style="font-weight:700;flex:1">'+f.name+'</span></div>'}).join(''):'<div style="font-size:8px;color:var(--tx3)">—</div>';document.querySelectorAll('#recallList .recall-item').forEach(function(el){el.addEventListener('click',function(){document.getElementById('frName').value=this.getAttribute('data-rn');document.getElementById('frIni').value=this.getAttribute('data-ri');document.getElementById('frRole').value=this.getAttribute('data-rr');toast('👤','Rappelé')})});rGTeamList()}

function openPPMo(){modalOpen=true;document.getElementById('ppModal').classList.add('on');document.getElementById('ppName').value='';document.getElementById('ppIni').value='';document.getElementById('ppIniHint').textContent='';document.getElementById('ppPerm').checked=false;document.getElementById('ppDatesRow').style.display='';document.getElementById('ppStart').value=D();document.getElementById('ppEnd').value='';var ppF=freelances.filter(function(f){return f.category==='postprod'});var seen={},uniq=[];ppF.forEach(function(f){if(!seen[f.name]){seen[f.name]=1;uniq.push(f)}});document.getElementById('ppRecallList').innerHTML=uniq.length?uniq.map(function(f){return '<div class="recall-item" data-rn="'+f.name+'" data-ri="'+(f.ini||f.name[0])+'"><span>📋</span><span style="font-weight:700;flex:1">'+f.name+'</span></div>'}).join(''):'<div style="font-size:8px;color:var(--tx3)">—</div>';document.querySelectorAll('#ppRecallList .recall-item').forEach(function(el){el.addEventListener('click',function(){document.getElementById('ppName').value=this.getAttribute('data-rn');document.getElementById('ppIni').value=this.getAttribute('data-ri');toast('📋','Rappelé·e')})});rPPTeamList()}
function rPPTeamList(){var ppF=freelances.filter(function(f){return f.category==='postprod'});var all=PP_FIXED.map(function(p){return{name:p.name,ini:p.ini,fixed:true,fbId:null}}).concat(ppF.map(function(f){return{name:f.name,ini:f.ini,fixed:false,permanent:isPerm(f),startDate:f.startDate,endDate:f.endDate,fbId:f.fbId}}));document.getElementById('ppTeamList').innerHTML=all.map(function(p){var badge=p.fixed?'<span style="font-size:5px;color:var(--tx3)">FIXE</span>':(p.permanent?'<span class="perm-badge">PERM</span>':'<span style="font:500 6px JetBrains Mono,monospace;color:var(--tx3)">'+fmtDS(p.startDate)+' → '+fmtDS(p.endDate)+'</span>');var del=p.fixed?'':'<button class="team-del" data-ppdel="'+p.fbId+'">✕</button>';return '<div class="team-item"><div class="team-av" style="background:linear-gradient(135deg,#0891b2,#06b6d4)">'+(p.ini||p.name[0])+'</div><div class="team-info"><div class="team-name">'+p.name+'</div><div class="team-role">PP '+badge+'</div></div>'+del+'</div>'}).join('');document.querySelectorAll('#ppTeamList .team-del').forEach(function(b){b.addEventListener('click',function(){delFree(this.getAttribute('data-ppdel'));setTimeout(function(){rPPTeamList();popPP()},600)})})}

function savePP(){var name=document.getElementById('ppName').value.trim(),ini=(document.getElementById('ppIni').value.trim()||autoInitials(name)).toUpperCase(),perm=document.getElementById('ppPerm').checked,sd=perm?D():document.getElementById('ppStart').value,ed=perm?PERM_END:document.getElementById('ppEnd').value;if(!name)return toast('⚠️','Nom requis');if(!perm&&(!sd||!ed))return toast('⚠️','Dates');fRef.push({name:name,ini:ini,role:'Post-Prod',startDate:sd,endDate:ed,type:'pp',category:'postprod',permanent:perm});toast('📋',name);document.getElementById('ppName').value='';document.getElementById('ppIni').value='';setTimeout(function(){rPPTeamList();popPP()},600)}
