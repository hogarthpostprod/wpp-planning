<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#050520;--navy2:#0a0a30;--navy3:#101045;--navy4:#18185a;--aqua:#2BFFC1;--aqua2:#1de8a8;--aqua-dim:rgba(43,255,193,.08);--aqua-mid:rgba(43,255,193,.15);--violet:#31117C;--violet2:#4a1da8;--glass:rgba(255,255,255,.03);--glass2:rgba(255,255,255,.05);--glass3:rgba(255,255,255,.08);--bdr:rgba(255,255,255,.06);--bdr2:rgba(255,255,255,.1);--tx1:#f0f4f8;--tx2:#8b95a8;--tx3:#505a6e;--green:#10b981;--yellow:#eab308;--amber:#f59e0b;--orange:#f97316;--red:#ef4444;--rose:#f43f5e;--r:14px;--r2:10px;--r3:6px}
body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--tx1);overflow-x:hidden;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(49,17,124,.15),transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(43,255,193,.04),transparent 50%);pointer-events:none;z-index:0}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(43,255,193,.12);border-radius:9px}

.hdr{position:sticky;top:0;z-index:100;background:rgba(5,5,32,.8);backdrop-filter:blur(30px);border-bottom:1px solid var(--bdr);padding:10px 20px;display:flex;align-items:center;gap:10px}
.logo-w{font-weight:900;font-size:16px;color:#fff;letter-spacing:-.5px}
.logo-p{font-weight:600;font-size:10px;color:var(--aqua);margin-left:4px;letter-spacing:1px;text-transform:uppercase}
.clock{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tx3);background:rgba(43,255,193,.05);padding:4px 10px;border-radius:20px;border:1px solid rgba(43,255,193,.1)}
.sync-b{font-size:8px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(43,255,193,.08);color:var(--aqua);border:1px solid rgba(43,255,193,.12);display:flex;align-items:center;gap:4px}
.sync-dot{width:5px;height:5px;border-radius:50%;background:var(--aqua);box-shadow:0 0 8px var(--aqua);animation:gl 2s infinite}
@keyframes gl{0%,100%{opacity:1}50%{opacity:.3}}
.spacer{flex:1}
.tabs{display:flex;gap:2px;background:rgba(43,255,193,.03);padding:3px;border-radius:11px;border:1px solid var(--bdr)}
.tab{padding:6px 14px;border:none;background:0;color:var(--tx3);font:600 10px/1 'Inter',sans-serif;border-radius:8px;cursor:pointer;transition:.25s;white-space:nowrap}
.tab:hover{color:var(--tx2);background:var(--glass2)}.tab.on{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;box-shadow:0 2px 14px rgba(49,17,124,.4)}
.wk{display:flex;align-items:center;gap:5px}.wk span{font-size:10px;font-weight:700;min-width:130px;text-align:center;color:var(--tx2)}
.ib{width:26px;height:26px;border:1px solid var(--bdr);border-radius:7px;background:var(--glass);color:var(--tx3);font-size:11px;cursor:pointer;display:grid;place-items:center;transition:.2s}.ib:hover{color:var(--aqua);background:var(--aqua-dim)}
.btn{padding:6px 12px;border:none;border-radius:9px;font:600 10px/1 'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px;transition:.25s;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,var(--aqua2),var(--aqua));color:var(--navy);box-shadow:0 2px 12px rgba(43,255,193,.2)}.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(43,255,193,.3)}
.btn-v{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;box-shadow:0 2px 10px rgba(49,17,124,.3)}.btn-v:hover{transform:translateY(-1px)}
.btn-g{background:var(--glass2);color:var(--tx2);border:1px solid var(--bdr)}.btn-g:hover{color:var(--tx1)}
.btn-d{background:rgba(244,63,94,.1);color:#fda4af;border:1px solid rgba(244,63,94,.1)}
.btn-o{background:linear-gradient(135deg,var(--amber),var(--orange));color:#1a1a2e}
.view{display:none;padding:14px 20px;position:relative;z-index:1;overflow-x:hidden}.view.on{display:block}
.plan-layout{display:grid;grid-template-columns:1fr 210px;gap:12px;overflow:hidden}

/* WEEKLY GRID - WPP themed */
.wg{display:grid;gap:1px;background:rgba(43,255,193,.04);border:1px solid rgba(43,255,193,.08);border-radius:var(--r2);overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,.3)}
.wg-h{background:var(--navy2);padding:8px 4px;font-size:8px;font-weight:700;color:var(--tx3);text-align:center;text-transform:uppercase;letter-spacing:.4px}
.wg-h.today{color:var(--aqua);background:rgba(43,255,193,.06)}
.wg-name{background:var(--navy2);padding:8px;font-weight:700;display:flex;align-items:center;gap:6px;overflow:hidden;border-right:1px solid var(--bdr)}
.wg-cell{background:var(--navy);padding:4px;min-height:64px;max-height:140px;overflow-y:auto;overflow-x:hidden;position:relative}
.wg-cell:hover{background:rgba(10,10,48,.9)}.wg-cell.today-col{background:rgba(43,255,193,.015)}.wg-cell.abs-cell{background:rgba(244,63,94,.03)}
.wg-task{padding:5px 6px;border-radius:5px;margin-bottom:3px;border-left:3px solid var(--violet2);background:linear-gradient(135deg,var(--glass2),var(--glass));cursor:pointer;transition:.2s;overflow:hidden}
.wg-task:hover{background:var(--glass3);transform:translateX(1px)}
.wg-task.urgent{border-left-color:var(--rose)}
.wg-task.done{opacity:.25;border-left-color:var(--green)}
.wg-task.livraison{border-left-color:var(--aqua);background:linear-gradient(135deg,rgba(43,255,193,.04),var(--glass))}
.wg-task.multiday{border-left-color:var(--violet);background:linear-gradient(135deg,rgba(49,17,124,.08),var(--glass))}
.wg-top{display:flex;align-items:center;gap:3px}
.wg-proj{font-weight:700;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;flex:1;min-width:0}
.wg-del{width:14px;height:14px;border-radius:50%;background:rgba(244,63,94,.1);color:#fda4af;border:1px solid rgba(244,63,94,.08);cursor:pointer;font-size:8px;display:grid;place-items:center;flex-shrink:0;transition:.2s;opacity:.4}.wg-del:hover{opacity:1;background:rgba(244,63,94,.25)}
.wg-day-badge{font:700 6px 'JetBrains Mono',monospace;background:rgba(49,17,124,.25);color:#c4b5fd;padding:1px 4px;border-radius:3px;flex-shrink:0}
.wg-info{font-size:6.5px;color:var(--tx3);margin-top:2px;display:flex;align-items:center;justify-content:space-between;gap:2px;overflow:hidden}
.wg-info-left{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.wg-sb{cursor:pointer;font:700 7px 'Inter',sans-serif;border:none;background:0;padding:1px 3px;border-radius:4px;flex-shrink:0;transition:.15s}.wg-sb:hover{background:var(--glass3)}
.wg-abs{padding:6px;border-radius:5px;font-size:8px;font-weight:700;text-align:center}
.wg-empty{height:100%;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--tx3);opacity:.3}
.cap-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.02)}.cap-fill{height:100%;transition:width .4s}
.cap-txt{position:absolute;bottom:4px;right:3px;font:700 6px 'JetBrains Mono',monospace;opacity:.7}
.s-ec{color:var(--aqua)}.s-at{color:#c4b5fd}.s-ok{color:#6ee7b7}
.sb{font:700 8px/1 'Inter',sans-serif;padding:3px 8px;border-radius:12px;cursor:pointer;border:none;transition:.2s;white-space:nowrap}.sb:hover{filter:brightness(1.15);transform:scale(1.03)}
.s-ecb{background:rgba(43,255,193,.1);color:var(--aqua);border:1px solid rgba(43,255,193,.1)}
.s-atb{background:rgba(196,181,253,.1);color:#c4b5fd;border:1px solid rgba(196,181,253,.1)}
.s-okb{background:rgba(110,231,183,.1);color:#6ee7b7;border:1px solid rgba(110,231,183,.1)}

/* SIDEBAR */
.side{display:flex;flex-direction:column;gap:10px;overflow:hidden;min-width:0}
.sc{background:linear-gradient(180deg,var(--navy2),var(--navy));border:1px solid var(--bdr);border-radius:var(--r2);padding:12px;overflow:hidden}
.sc-t{font-size:9px;font-weight:700;color:var(--aqua);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;opacity:.7}
.rm{border:1px solid var(--bdr);border-radius:var(--r3);padding:8px;margin-bottom:4px;transition:.2s}.rm:last-child{margin:0}.rm:hover{border-color:var(--bdr2)}
.rm-a{border-color:rgba(245,158,11,.1);background:linear-gradient(135deg,rgba(245,158,11,.03),transparent)}
.rm-b{border-color:rgba(43,255,193,.08);background:linear-gradient(135deg,rgba(43,255,193,.02),transparent)}
.rm-x{border-color:rgba(99,102,241,.08);background:linear-gradient(135deg,rgba(99,102,241,.02),transparent)}
.rm-l{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--tx3);margin-bottom:4px}
.rm-sub{font-size:6px;color:var(--tx3);opacity:.6;margin-bottom:4px}
.rm-ps{display:flex;gap:3px;flex-wrap:wrap}
.rp{background:var(--glass);border:1px solid var(--bdr);border-radius:5px;padding:3px 5px;font-size:7px;display:flex;align-items:center;gap:3px;flex:1;min-width:40px}
.rp-d{width:5px;height:5px;border-radius:50%}.rp-on{background:var(--aqua);box-shadow:0 0 5px var(--aqua)}.rp-off{background:var(--tx3);opacity:.2}
.dl{display:flex;align-items:center;gap:5px;padding:5px 0;border-bottom:1px solid var(--bdr);overflow:hidden}.dl:last-child{border:0}
.dl-d{font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:600;min-width:28px;text-align:center;padding:2px 4px;border-radius:5px;flex-shrink:0}.dl-td{background:rgba(244,63,94,.1);color:#fda4af}.dl-tm{background:rgba(245,158,11,.1);color:#fcd34d}.dl-lt{background:var(--glass);color:var(--tx3)}
.dl-info{flex:1;min-width:0;overflow:hidden}.dl-p{font-size:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dl-a{font-size:7px;color:var(--tx3)}

/* FREELANCE BADGE */
.free-badge{font-size:5px;font-weight:700;padding:1px 4px;border-radius:3px;background:rgba(49,17,124,.3);color:#c4b5fd;text-transform:uppercase;letter-spacing:.3px}

/* SALLE TABLET */
.salle{display:none;min-height:100vh;background:linear-gradient(180deg,var(--navy),#030312);overflow-x:hidden}.salle.on{display:flex;flex-direction:column}
.s-hdr{padding:20px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(43,255,193,.08);background:rgba(5,5,32,.85);backdrop-filter:blur(20px)}
.s-logo{font-size:16px;font-weight:900;color:#fff}.s-logo-p{color:var(--aqua);font-size:10px;font-weight:600;letter-spacing:1px;margin-left:4px}
.s-date{font-size:11px;color:var(--tx3);margin-top:2px}
.s-room{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}.s-dot{width:12px;height:12px;border-radius:50%}
.s-clk{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;color:var(--aqua);opacity:.6}
.s-body{flex:1;padding:18px 28px;overflow-y:auto;overflow-x:hidden}
.s-person{background:linear-gradient(135deg,var(--navy2),var(--navy));border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.s-ph{display:flex;align-items:center;gap:12px;margin-bottom:10px}.s-av{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:16px;font-weight:900;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.s-pn{font-size:17px;font-weight:800}.s-pr{font-size:10px;color:var(--tx3)}.s-cap{margin-left:auto;text-align:right}.s-cap-pct{font:800 20px 'JetBrains Mono',monospace}.s-cap-bar{width:80px;height:5px;background:rgba(255,255,255,.04);border-radius:9px;overflow:hidden;margin-top:3px}.s-cap-fill{height:100%;border-radius:9px}
.s-tasks{display:flex;flex-direction:column;gap:5px}
.s-tk{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r3);background:var(--glass);border:1px solid var(--bdr);overflow:hidden}
.s-tk-slot{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--tx3);min-width:80px;max-width:80px;text-align:center;background:var(--glass);padding:3px 6px;border-radius:5px;border:1px solid var(--bdr);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-tk-cli{font-size:8px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.s-tk-proj{flex:1;font-size:13px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-tk-type{font-size:9px;font-weight:600;padding:2px 7px;border-radius:5px;color:var(--tx2);background:var(--glass2);border:1px solid var(--bdr);white-space:nowrap;flex-shrink:0}
.s-tk-sta{font-size:9px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap;flex-shrink:0}
.s-empty{text-align:center;padding:20px;color:var(--tx3);font-size:13px}
.s-footer{padding:10px 28px;border-top:1px solid var(--bdr);display:flex;justify-content:space-between;font-size:8px;color:var(--tx3);background:rgba(5,5,32,.6)}

/* MODALS */
.mo{display:none;position:fixed;inset:0;background:rgba(5,5,20,.75);backdrop-filter:blur(8px);z-index:1000;place-items:center}.mo.on{display:grid}
.mo-b{background:linear-gradient(180deg,var(--navy3),var(--navy));border:1px solid rgba(43,255,193,.1);border-radius:var(--r);padding:22px;width:440px;max-height:85vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.6);animation:su .25s ease}
@keyframes su{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.mo-t{font-size:15px;font-weight:800;margin-bottom:16px;color:var(--aqua)}
.fg{margin-bottom:8px}.fl{display:block;font-size:8px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.fi,.fs{width:100%;padding:8px 12px;background:rgba(43,255,193,.03);border:1px solid var(--bdr);border-radius:var(--r3);color:var(--tx1);font:12px/1.4 'Inter',sans-serif;outline:0;transition:.2s}
.fi:focus,.fs:focus{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(43,255,193,.06)}.fs{cursor:pointer}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mo-a{display:flex;gap:6px;justify-content:flex-end;margin-top:16px}
.cap-warn{margin-top:10px;padding:10px 14px;border-radius:var(--r3);font-size:10px;font-weight:700;display:none}
.cap-warn.over{display:block;background:rgba(245,158,11,.06);color:#fcd34d;border:1px solid rgba(245,158,11,.1)}
.cap-warn.blocked{display:block;background:rgba(244,63,94,.06);color:#fda4af;border:1px solid rgba(244,63,94,.1)}
.hint{font-size:8px;color:var(--tx3);margin-top:2px;font-style:italic}

/* FREELANCE RECALL LIST */
.recall-list{margin-top:8px;max-height:120px;overflow-y:auto}
.recall-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--bdr);border-radius:6px;margin-bottom:3px;cursor:pointer;transition:.2s;font-size:10px}
.recall-item:hover{background:var(--aqua-dim);border-color:rgba(43,255,193,.15)}
.recall-item .ri-name{font-weight:700;flex:1}
.recall-item .ri-role{font-size:8px;color:var(--tx3)}

.toast{position:fixed;bottom:16px;right:16px;background:linear-gradient(135deg,var(--navy3),var(--navy));border:1px solid rgba(43,255,193,.15);border-radius:var(--r2);padding:10px 16px;display:flex;align-items:center;gap:6px;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:2000;transform:translateY(70px);opacity:0;transition:.35s cubic-bezier(.4,0,.2,1);font-size:11px;font-weight:600}.toast.on{transform:translateY(0);opacity:1}
.av{display:grid;place-items:center;font-weight:800;color:#fff;border-radius:8px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.av-g{background:linear-gradient(135deg,var(--violet),var(--violet2))}.av-m{background:linear-gradient(135deg,#1e3a5f,var(--aqua2))}.av-a{background:linear-gradient(135deg,#059669,#14b8a6)}.av-f{background:linear-gradient(135deg,#6d28d9,#a78bfa)}
.abs-grid{display:grid;gap:1px;background:rgba(43,255,193,.04);border:1px solid rgba(43,255,193,.06);border-radius:var(--r2);overflow:hidden}
.abs-h{background:var(--navy2);padding:8px;font-size:9px;font-weight:700;color:var(--tx3);text-align:center;text-transform:uppercase}.abs-h.today{color:var(--aqua)}
.abs-nm{background:var(--navy2);padding:8px;font-weight:700;display:flex;align-items:center;gap:5px;font-size:10px;overflow:hidden}
.abs-cl{background:var(--navy);padding:4px;display:flex;align-items:center;justify-content:center}
.abs-tag{font-size:7px;font-weight:700;padding:3px 7px;border-radius:8px;white-space:nowrap}
</style>
</head>
<body>
<div class="hdr" id="hdr">
  <span class="logo-w">WPP</span><span class="logo-p">Production</span>
  <div class="clock" id="clk">--:--</div>
  <div class="sync-b"><span class="sync-dot"></span>Sync</div>
  <div class="spacer"></div>
  <div class="tabs">
    <button class="tab on" data-v="planning">📋 Semaine</button>
    <button class="tab" data-v="absences">🏖️ Absences</button>
    <button class="tab" data-v="kanban">📊 Kanban</button>
  </div>
  <div class="spacer"></div>
  <div class="wk"><button class="ib" id="wp">◀</button><span id="wl">—</span><button class="ib" id="wn">▶</button></div>
  <button class="btn btn-p" id="addBtn">＋ Tâche</button>
  <button class="btn btn-o" id="addAbsBtn">＋ Absence</button>
  <button class="btn btn-v" id="addFreeBtn">👤 Freelance</button>
</div>
<div class="view on" id="vPlan"><div class="plan-layout"><div id="weekGrid" style="min-width:0;overflow:hidden"></div><div class="side"><div class="sc"><div class="sc-t">🏢 Postes de travail</div><div id="rooms"></div></div><div class="sc"><div class="sc-t">🚀 Livraisons</div><div id="deliv"></div></div></div></div></div>
<div class="view" id="vAbs"><div id="absCal"></div></div>
<div class="view" id="vKan"><div id="kboard" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"></div></div>
<div class="salle" id="vSalle"></div>

<!-- TASK MODAL -->
<div class="mo" id="modal"><div class="mo-b">
  <div class="mo-t" id="moTitle">✨ Nouvelle Tâche</div>
  <div class="fg"><label class="fl">Projet</label><input class="fi" id="fProj" placeholder="Nom du projet..."></div>
  <div class="fr3"><div class="fg"><label class="fl">Client</label><select class="fs" id="fCli"><option>Mondelez</option><option>Accor</option><option>Allianz</option><option>Herta</option><option>Coca-Cola</option><option>Nestlé</option><option>L'Oréal</option><option>GMF</option><option>Generali</option><option>Atlantic</option><option>Autre</option></select></div><div class="fg"><label class="fl">Assigné à</label><select class="fs" id="fAss"></select></div><div class="fg"><label class="fl">Post-Prod</label><select class="fs" id="fPP"><option value="">—</option><option>Florence</option><option>Séverine</option><option>Marion</option><option>Diane</option><option>Mia</option></select></div></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyDT0L4RiFMn3_UWUz18-U9TyP9oYse8dg0",authDomain:"wpp-planning.firebaseapp.com",databaseURL:"https://wpp-planning-default-rtdb.europe-west1.firebasedatabase.app",projectId:"wpp-planning",storageBucket:"wpp-planning.firebasestorage.app",messagingSenderId:"838345318618",appId:"1:838345318618:web:322eef528c7ed1cd95c5e3"});
const db=firebase.database(),tRef=db.ref('tasks'),aRef=db.ref('absences'),fRef=db.ref('freelances');

// ═══ TEAM (no default room assignment) ═══
const TEAM_FIXED=[
  {name:'Quentin',role:'Graphiste',ini:'Q',type:'g',fixed:true},
  {name:'Nycolas',role:'Graphiste',ini:'N',type:'g',fixed:true},
  {name:'Loick',role:'Graphiste',ini:'L',type:'g',fixed:true},
  {name:'Dali',role:'Monteur Réal.',ini:'D',type:'m',fixed:true},

];

const SF=['En cours','En attente','Terminé'],SI={'En cours':'⚡','En attente':'⏳','Terminé':'✅'},SB={'En cours':'s-ecb','En attente':'s-atb','Terminé':'s-okb'},SC={'En cours':'s-ec','En attente':'s-at','Terminé':'s-ok'};
const CC={'Mondelez':'rgba(49,17,124,.15)','Accor':'rgba(6,182,212,.12)','Allianz':'rgba(43,255,193,.1)','Herta':'rgba(16,185,129,.12)','Coca-Cola':'rgba(244,63,94,.1)','GMF':'rgba(249,115,22,.1)','Nestlé':'rgba(245,158,11,.1)',"L'Oréal":'rgba(236,72,153,.1)'};
const AL={'c':'🏖️ Congés','o':'🔴 OFF','e':'🎓 École','f':'📚 Formation','m':'🤒 Maladie','t':'🎬 Tournage','p':'📋 Plénière'};
const ABC={'c':'rgba(245,158,11,.1)','o':'rgba(244,63,94,.1)','e':'rgba(49,17,124,.15)','f':'rgba(6,182,212,.1)','m':'rgba(244,63,94,.12)','t':'rgba(43,255,193,.08)','p':'rgba(249,115,22,.1)'};
const DAY_H=8,MAX_P=120;
function sH(s){if(!s)return 8;if(s.includes('Journée'))return 8;if(s.includes('Matin'))return 3;if(s.includes('Après'))return 5;if(s.includes('10h'))return 1.5;if(s.includes('11h30'))return 1.5;if(s.includes('14h'))return 1.5;if(s.includes('15h30'))return 3.5;if(s==='1h')return 1;if(s==='2h')return 2;return 8}
function taskOnDay(t,d){return d>=t.date&&d<=(t.dateEnd||t.date)}
function isMulti(t){return t.dateEnd&&t.dateEnd>t.date}
function taskDays(t){return isMulti(t)?Math.round((new Date(t.dateEnd)-new Date(t.date))/864e5)+1:1}
function taskDayNum(t,d){return isMulti(t)?Math.round((new Date(d)-new Date(t.date))/864e5)+1:0}
function taskH(t){return isMulti(t)?8:sH(t.slot)}
function dL(w,d,ex){return tasks.filter(t=>t.who===w&&taskOnDay(t,d)&&t.fbId!==ex).reduce((s,t)=>s+taskH(t),0)}
function dP(w,d,ex){return Math.round(dL(w,d,ex)/DAY_H*100)}
function cC(p){return p>120?'var(--rose)':p>100?'var(--amber)':p>70?'var(--yellow)':'var(--aqua)'}

let tasks=[],absences=[],freelances=[],editId=null,weekOff=0,curView='planning';
const salleP=new URLSearchParams(window.location.search).get('salle');

// ═══ Get active team (fixed + active freelances) ═══
function getTeam(dates){
  const active=freelances.filter(f=>{
    if(!dates)return true;
    return dates.some(d=>d>=f.startDate&&d<=f.endDate);
  });
  return[...TEAM_FIXED,...active.map(f=>({name:f.name,role:f.role,ini:f.ini,type:'f',fixed:false,fbId:f.fbId}))];
}

function populateAssignees(){
  const team=getTeam();
  ['fAss','aPer'].forEach(id=>{
    const sel=document.getElementById(id);if(!sel)return;
    sel.innerHTML=team.map(p=>`<option>${p.name}</option>`).join('');
  });
}

// ═══ FIREBASE LISTENERS ═══
tRef.on('value',s=>{const d=s.val()||{};tasks=Object.entries(d).map(([k,v])=>({...v,fbId:k}));rv()});
aRef.on('value',s=>{const d=s.val()||{};absences=Object.entries(d).map(([k,v])=>({...v,fbId:k}));rv()});
fRef.on('value',s=>{const d=s.val()||{};freelances=Object.entries(d).map(([k,v])=>({...v,fbId:k}));populateAssignees();rv()});
function rv(){if(salleP)return rS();if(curView==='planning')render();else if(curView==='absences')rAbs();else if(curView==='kanban')rKb()}

function D(n=0){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().split('T')[0]}
function isT(s){return s===D()}function isTm(s){return s===D(1)}
function iA(n,d){return absences.find(a=>a.who===n&&d>=a.start&&d<=a.end)}
function isL(t){return t.typ==='Livraison'}
function wkd(o){const n=new Date(),d=n.getDay(),m=new Date(n);m.setDate(n.getDate()-(d===0?6:d-1)+o*7);const r=[];for(let i=0;i<5;i++){const x=new Date(m);x.setDate(m.getDate()+i);r.push(x.toISOString().split('T')[0])}return r}
function wn(s){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w)/864e5-3+(w.getDay()+6)%7)/7)}
function updW(){const w=wkd(weekOff);const f=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});document.getElementById('wl').textContent='S'+wn(w[0])+' · '+f(w[0])+' → '+f(w[4])}
function tick(){const n=new Date(),s=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');document.getElementById('clk').textContent=s;const sc=document.getElementById('sClk');if(sc)sc.textContent=s}
setInterval(tick,1e3);tick();
function toast(i,t){const el=document.getElementById('toast');document.getElementById('tI').textContent=i;document.getElementById('tT').textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),3e3)}
function avC(p){return p.type==='g'?'av-g':p.type==='m'?'av-m':p.type==='f'?'av-f':'av-a'}
function avBg(p){return p.type==='g'?'linear-gradient(135deg,#31117C,#6d28d9)':p.type==='m'?'linear-gradient(135deg,#1e3a5f,#06b6d4)':p.type==='f'?'linear-gradient(135deg,#6d28d9,#a78bfa)':'linear-gradient(135deg,#059669,#14b8a6)'}
function addT(t){tRef.push(t);toast('✅','Synchronisée')}
function updT(id,d){tRef.child(id).update(d)}
function delT(id){tRef.child(id).remove();toast('🗑','Supprimée')}
function addA(a){aRef.push(a);toast('🏖️','Enregistrée')}
function delA(id){aRef.child(id).remove();toast('🗑','Supprimée')}
function cyc(fbId){const t=tasks.find(x=>x.fbId===fbId);if(!t)return;const ns=SF[(SF.indexOf(t.sta)+1)%SF.length];updT(fbId,{sta:ns});if(ns==='Terminé')toast('✅',t.who+' a terminé '+t.proj)}

// ═══ WEEKLY GRID ═══
function render(){
  const dates=wkd(weekOff);const dn=['LUN','MAR','MER','JEU','VEN'];
  const team=getTeam(dates);
  let h=`<div class="wg" style="grid-template-columns:110px repeat(5,1fr)"><div class="wg-h" style="font-size:7px;line-height:1.3">10h → 19h<br>⏸ 13h-14h</div>`;
  dates.forEach((d,i)=>{const dd=new Date(d+'T12:00:00');h+=`<div class="wg-h${isT(d)?' today':''}">${dn[i]}<br><span style="font-size:12px;font-weight:800">${dd.getDate()}</span><span style="font-size:7px;opacity:.5">/${dd.getMonth()+1}</span></div>`});
  team.forEach(p=>{
    h+=`<div class="wg-name"><div class="av ${avC(p)}" style="width:24px;height:24px;font-size:9px">${p.ini}</div><div style="min-width:0"><div style="font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</div><div style="font-size:7px;color:var(--tx3)">${p.role}${!p.fixed?' <span class="free-badge">FREE</span>':''}</div></div></div>`;
    dates.forEach(d=>{
      // Hide freelance cells outside their mission dates
      if(!p.fixed){const f=freelances.find(x=>x.name===p.name);if(f&&(d<f.startDate||d>f.endDate)){h+=`<div class="wg-cell" style="opacity:.15"><div class="wg-empty">—</div></div>`;return}}
      const ab=iA(p.name,d);const tdy=isT(d)?' today-col':'';
      if(ab){h+=`<div class="wg-cell abs-cell${tdy}"><div class="wg-abs" style="background:${ABC[ab.type]}">${AL[ab.type]}</div></div>`;return}
      const dt=tasks.filter(t=>t.who===p.name&&taskOnDay(t,d)).sort((a,b)=>SF.indexOf(a.sta)-SF.indexOf(b.sta));
      const pct=dP(p.name,d);const cc=cC(pct);
      h+=`<div class="wg-cell${tdy}">`;
      if(!dt.length)h+=`<div class="wg-empty">—</div>`;
      else dt.forEach(t=>{
        const uc=t.pri==='Urgent'?' urgent':'';const dc=t.sta==='Terminé'?' done':'';const lv=isL(t)?' livraison':'';const md=isMulti(t)?' multiday':'';
        const dayBadge=isMulti(t)?`<span class="wg-day-badge">J${taskDayNum(t,d)}/${taskDays(t)}</span>`:'';
        h+=`<div class="wg-task${uc}${dc}${lv}${md}" data-id="${t.fbId}"><div class="wg-top"><div class="wg-proj">${isL(t)?'🚀 ':''}${t.proj}</div>${dayBadge}<button class="wg-del" data-did="${t.fbId}">✕</button></div><div class="wg-info"><span class="wg-info-left">${t.typ}${isMulti(t)?'':t.slot&&t.slot!=='Journée'?' · '+t.slot:''}${t.pp?' · 📋'+t.pp:''}</span><button class="wg-sb ${SC[t.sta]}" data-sid="${t.fbId}">${SI[t.sta]}</button></div></div>`;
      });
      if(dt.length)h+=`<div class="cap-bar"><div class="cap-fill" style="width:${Math.min(pct,120)}%;background:${cc}"></div></div><div class="cap-txt" style="color:${cc}">${pct}%</div>`;
      h+=`</div>`;
    });
  });
  h+=`</div>`;document.getElementById('weekGrid').innerHTML=h;
  document.querySelectorAll('.wg-sb[data-sid]').forEach(b=>{b.addEventListener('click',function(e){e.stopPropagation();cyc(this.dataset.sid)})});
  document.querySelectorAll('.wg-del[data-did]').forEach(b=>{b.addEventListener('click',function(e){e.stopPropagation();delT(this.dataset.did)})});
  document.querySelectorAll('.wg-task[data-id]').forEach(el=>{el.addEventListener('dblclick',function(){openMo(this.dataset.id)})});
  rRm();rDl();
}

// ═══ ROOMS (physical layout, no default assignments) ═══
function rRm(){
  const td=tasks.filter(t=>taskOnDay(t,D())&&t.sta!=='Terminé');
  const working=td.map(t=>t.who);
  const hasPz=td.some(t=>t.typ==='Présentation');
  const pzW=hasPz?td.find(t=>t.typ==='Présentation'):null;
  const activeCount=new Set(working).size;
  document.getElementById('rooms').innerHTML=`
    <div class="rm rm-a"><div class="rm-l">⭐ Régie A</div><div class="rm-sub">Poste présentation + Double écran</div><div class="rm-ps"><div class="rp"><span class="rp-d ${hasPz?'rp-on':'rp-off'}"></span><span style="font-size:7px">${pzW?pzW.who+' (Prez)':'Libre'}</span></div></div></div>
    <div class="rm rm-b"><div class="rm-l">🎬 Régie B</div><div class="rm-sub">3 postes + Double écran laptop</div><div class="rm-ps"><div class="rp"><span class="rp-d rp-off"></span><span style="font-size:7px">P1</span></div><div class="rp"><span class="rp-d rp-off"></span><span style="font-size:7px">P2</span></div><div class="rp"><span class="rp-d rp-off"></span><span style="font-size:7px">P3</span></div><div class="rp"><span class="rp-d rp-off"></span><span style="font-size:7px">🖥🖥</span></div></div></div>
    <div class="rm rm-x"><div class="rm-l">📎 Poste Assistant</div><div class="rm-sub">Extérieur régies</div><div class="rm-ps"><div class="rp"><span class="rp-d rp-off"></span><span style="font-size:7px">Libre</span></div></div></div>
    <div style="margin-top:6px;font-size:8px;color:var(--tx3);text-align:center">${activeCount} personne${activeCount>1?'s':''} en activité</div>`;
}

function rDl(){const up=tasks.filter(t=>isL(t)&&t.sta!=='Terminé'&&(t.dateEnd||t.date)>=D()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);document.getElementById('deliv').innerHTML=up.length?up.map(t=>{const c=isT(t.date)?'dl-td':isTm(t.date)?'dl-tm':'dl-lt';const l=isT(t.date)?'AUJ':isTm(t.date)?'DEM':new Date(t.date+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});return`<div class="dl"><span class="dl-d ${c}">${l}</span><div class="dl-info"><div class="dl-p">🚀 ${t.proj}</div><div class="dl-a">→ ${t.who}${t.pp?' · 📋'+t.pp:''}</div></div></div>`}).join(''):'<div style="text-align:center;color:var(--tx3);font-size:9px;padding:10px;opacity:.4">Aucune livraison</div>'}

// ═══ ABSENCES ═══
function rAbs(){const dates=wkd(weekOff);const dn=['LUN','MAR','MER','JEU','VEN'];const team=getTeam(dates);let h=`<div class="abs-grid" style="grid-template-columns:110px repeat(5,1fr)"><div class="abs-h"></div>`;dates.forEach((d,i)=>{const dd=new Date(d+'T12:00:00');h+=`<div class="abs-h${isT(d)?' today':''}">${dn[i]} <span style="font-size:11px;font-weight:800">${dd.getDate()}</span>/${dd.getMonth()+1}</div>`});team.forEach(p=>{h+=`<div class="abs-nm"><div class="av ${avC(p)}" style="width:20px;height:20px;font-size:8px">${p.ini}</div>${p.name}${!p.fixed?' <span class="free-badge">FREE</span>':''}</div>`;dates.forEach(d=>{const ab=iA(p.name,d);h+=`<div class="abs-cl">${ab?`<span class="abs-tag" style="background:${ABC[ab.type]}">${AL[ab.type]}</span>`:''}</div>`})});h+='</div>';h+='<div style="margin-top:12px;background:linear-gradient(180deg,var(--navy2),var(--navy));border:1px solid var(--bdr);border-radius:var(--r2);padding:14px"><div class="sc-t">📅 Liste</div>';const sorted=[...absences].sort((a,b)=>(a.start||'').localeCompare(b.start||''));sorted.forEach(a=>{const s=new Date(a.start+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});const e=new Date(a.end+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});const days=Math.round((new Date(a.end)-new Date(a.start))/864e5)+1;h+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bdr)"><span class="abs-tag" style="background:${ABC[a.type]};min-width:55px;text-align:center">${AL[a.type]}</span><span style="font-size:11px;font-weight:700">${a.who}</span><span style="font-size:9px;color:var(--tx3);flex:1">${s} → ${e} (${days}j)${a.note?' · '+a.note:''}</span><button class="btn btn-d" style="padding:2px 6px;font-size:7px" data-adel="${a.fbId}">✕</button></div>`});if(!sorted.length)h+='<div style="text-align:center;color:var(--tx3);font-size:10px;padding:12px;opacity:.4">Aucune absence</div>';h+='</div>';document.getElementById('absCal').innerHTML=h;document.querySelectorAll('[data-adel]').forEach(b=>{b.addEventListener('click',function(){delA(this.dataset.adel)})})}

// ═══ KANBAN ═══
function rKb(){const w=wkd(weekOff);const seen=new Set();const allT=[];w.forEach(d=>{tasks.forEach(t=>{if(taskOnDay(t,d)&&!seen.has(t.fbId)){seen.add(t.fbId);allT.push(t)}})});document.getElementById('kboard').innerHTML=SF.map(s=>{const st=allT.filter(t=>t.sta===s);const bc=s==='Terminé'?'var(--green)':s==='En cours'?'var(--aqua)':'var(--violet2)';return`<div><div style="font-size:10px;font-weight:700;color:var(--tx2);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid ${bc}">${SI[s]} ${s} <span style="opacity:.4">(${st.length})</span></div>${st.map(t=>`<div style="background:linear-gradient(135deg,var(--navy2),var(--navy));border:1px solid var(--bdr);border-radius:var(--r3);padding:10px;margin-bottom:6px${isL(t)?';border-left:3px solid var(--aqua)':isMulti(t)?';border-left:3px solid var(--violet)':''}"><div style="display:flex;justify-content:space-between"><div style="font-size:7px;font-weight:700;color:var(--tx3);text-transform:uppercase">${t.cli}${t.pp?' · 📋'+t.pp:''}</div><button class="wg-del" data-kdel="${t.fbId}" style="opacity:.5">✕</button></div><div style="font-size:10px;font-weight:700;margin:3px 0">${isL(t)?'🚀 ':''}${t.proj}${isMulti(t)?' <span style="font-size:7px;color:var(--violet2)">'+taskDays(t)+'j</span>':''}</div><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:7px;color:var(--tx3)">${t.who} · ${t.typ}</span><button class="sb ${SB[t.sta]}" data-kid="${t.fbId}">${SI[t.sta]}</button></div></div>`).join('')}</div>`}).join('');document.querySelectorAll('[data-kid]').forEach(b=>{b.addEventListener('click',function(){cyc(this.dataset.kid)})});document.querySelectorAll('[data-kdel]').forEach(b=>{b.addEventListener('click',function(){delT(this.dataset.kdel)})})}

// ═══ SALLE TABLET (shows ALL active people) ═══
function rS(){
  const room=salleP;const isA=room==='regiea';
  const rN=isA?'Régie A — Présentation + Double Écran':'Régie B — 3 Postes + Double Écran';
  const rC=isA?'var(--amber)':'var(--aqua)';
  const n=new Date();const dayN=n.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const td=tasks.filter(t=>taskOnDay(t,D())&&t.sta!=='Terminé');
  const team=getTeam([D()]);
  const activeNames=[...new Set(td.map(t=>t.who))];
  let cards='';
  activeNames.forEach(name=>{
    const p=team.find(x=>x.name===name);if(!p)return;
    const ab=iA(name,D());const pt=td.filter(t=>t.who===name);const pct=dP(name,D());const cc=cC(pct);
    let tH='';if(ab)tH=`<div class="s-empty">${AL[ab.type]}</div>`;else if(!pt.length)tH=`<div class="s-empty">Libre</div>`;
    else tH='<div class="s-tasks">'+pt.map(t=>{const dayInfo=isMulti(t)?'J'+taskDayNum(t,D())+'/'+taskDays(t):t.slot||'Journée';return`<div class="s-tk"><div class="s-tk-slot">${dayInfo}</div><div class="s-tk-cli" style="background:${CC[t.cli]||'var(--glass2)'}">${t.cli}</div><div class="s-tk-proj">${isL(t)?'🚀 ':''}${t.proj}</div><div class="s-tk-type">${t.typ}</div><div class="s-tk-sta ${SB[t.sta]}">${SI[t.sta]} ${t.sta}</div></div>${t.pp?`<div style="font-size:8px;color:var(--tx3);padding:0 12px">📋 ${t.pp}</div>`:''}`}).join('')+'</div>';
    cards+=`<div class="s-person" ${ab?'style="opacity:.35"':''}><div class="s-ph"><div class="s-av" style="background:${avBg(p)}">${p.ini}</div><div><div class="s-pn">${p.name}</div><div class="s-pr">${p.role}${!p.fixed?' · FREELANCE':''}</div></div>${ab?'':`<div class="s-cap"><div class="s-cap-pct" style="color:${cc}">${pct}%</div><div class="s-cap-bar"><div class="s-cap-fill" style="width:${Math.min(pct,120)}%;background:${cc}"></div></div></div>`}</div>${tH}</div>`;
  });
  if(!activeNames.length)cards=`<div class="s-empty">Personne en activité aujourd'hui</div>`;
  document.getElementById('vSalle').innerHTML=`<div class="s-hdr"><div><span class="s-logo">WPP</span><span class="s-logo-p">Production</span><div class="s-date">${dayN}</div></div><div class="s-room"><span class="s-dot" style="background:${rC};box-shadow:0 0 10px ${rC}"></span>${rN}</div><div class="s-clk" id="sClk">${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}</div></div><div class="s-body">${cards}</div><div class="s-footer"><div style="display:flex;align-items:center;gap:4px"><span class="sync-dot"></span>Temps réel</div><div>${activeNames.length} personne${activeNames.length>1?'s':''} en activité</div></div>`;
}

// ═══ TASK MODAL ═══
function updateSlotHint(){const d1=document.getElementById('fDat').value,d2=document.getElementById('fDatEnd').value,hint=document.getElementById('slotHint'),slo=document.getElementById('fSlo');if(d2&&d2>d1){hint.textContent='📅 Multi-jours → 100%/jour auto';hint.style.color='var(--aqua)';slo.disabled=true;slo.value='Journée'}else{hint.textContent='';slo.disabled=false}}
function checkCap(){const who=document.getElementById('fAss').value,date=document.getElementById('fDat').value,dateEnd=document.getElementById('fDatEnd').value,slot=document.getElementById('fSlo').value;if(!who||!date)return;const isM=dateEnd&&dateEnd>date;const newH=isM?8:sH(slot);const tot=Math.round((dL(who,date,editId)+newH)/DAY_H*100);const w=document.getElementById('capWarn');if(tot>MAX_P){w.className='cap-warn blocked';w.textContent=`🔴 BLOQUÉ — ${who} serait à ${tot}%`;w.style.display='block'}else if(tot>100){w.className='cap-warn over';w.textContent=`⚠️ Surcharge — ${who} à ${tot}%`;w.style.display='block'}else{w.style.display='none'}}
function openMo(id){editId=id||null;populateAssignees();document.getElementById('modal').classList.add('on');document.getElementById('moTitle').textContent=id?'✏️ Modifier':'✨ Nouvelle Tâche';document.getElementById('moDelBtn').style.display=id?'flex':'none';document.getElementById('capWarn').style.display='none';document.getElementById('fSlo').disabled=false;if(id){const t=tasks.find(x=>x.fbId===id);if(!t)return;document.getElementById('fProj').value=t.proj||'';document.getElementById('fCli').value=t.cli||'Autre';document.getElementById('fAss').value=t.who||'Quentin';document.getElementById('fPP').value=t.pp||'';document.getElementById('fTyp').value=t.typ||'Motion';document.getElementById('fSta').value=t.sta||'En cours';document.getElementById('fDat').value=t.date||D();document.getElementById('fDatEnd').value=t.dateEnd||'';document.getElementById('fSlo').value=t.slot||'Journée';document.getElementById('fPri').value=t.pri||'Normal';document.getElementById('fNot').value=t.note||''}else{document.getElementById('fProj').value='';document.getElementById('fDat').value=D();document.getElementById('fDatEnd').value='';document.getElementById('fSta').value='En cours';document.getElementById('fPri').value='Normal';document.getElementById('fPP').value='';document.getElementById('fNot').value='';document.getElementById('fSlo').value='Journée'}setTimeout(()=>{updateSlotHint();checkCap()},50)}
function closeMo(){document.getElementById('modal').classList.remove('on');editId=null}
function saveMo(){const proj=document.getElementById('fProj').value.trim();if(!proj){toast('⚠️','Projet requis');return}const who=document.getElementById('fAss').value,date=document.getElementById('fDat').value,dateEnd=document.getElementById('fDatEnd').value||'';const isM=dateEnd&&dateEnd>date;const slot=isM?'Journée':document.getElementById('fSlo').value;const tot=Math.round((dL(who,date,editId)+(isM?8:sH(slot)))/DAY_H*100);if(tot>MAX_P){toast('🔴',`Bloqué: ${who} à ${tot}%`);return}if(isM){let d=new Date(date);const end=new Date(dateEnd);while(d<=end){const ds=d.toISOString().split('T')[0];if(iA(who,ds)){toast('⚠️',who+' absent le '+ds);return}d.setDate(d.getDate()+1)}}else{if(iA(who,date)){toast('⚠️',who+' absent !');return}}const data={proj,cli:document.getElementById('fCli').value,who,pp:document.getElementById('fPP').value,typ:document.getElementById('fTyp').value,sta:document.getElementById('fSta').value,date,dateEnd:dateEnd||null,slot,pri:document.getElementById('fPri').value,note:document.getElementById('fNot').value};if(editId)updT(editId,data);else addT(data);closeMo()}
['fAss','fDat','fDatEnd','fSlo'].forEach(id=>{document.getElementById(id).addEventListener('change',function(){updateSlotHint();checkCap()})});

// ═══ FREELANCE MODAL ═══
function openFreeMo(){
  document.getElementById('freeModal').classList.add('on');
  document.getElementById('frName').value='';document.getElementById('frIni').value='';
  document.getElementById('frRole').value='';document.getElementById('frStart').value=D();document.getElementById('frEnd').value='';
  // Show recall list
  const unique=[...new Map(freelances.map(f=>[f.name,f])).values()];
  document.getElementById('recallList').innerHTML=unique.length?unique.map(f=>`<div class="recall-item" data-rn="${f.name}" data-ri="${f.ini}" data-rr="${f.role}"><span style="font-size:12px">👤</span><span class="ri-name">${f.name}</span><span class="ri-role">${f.role}</span></div>`).join(''):'<div style="font-size:9px;color:var(--tx3);padding:4px">Aucun ancien freelance</div>';
  document.querySelectorAll('.recall-item').forEach(el=>{el.addEventListener('click',function(){document.getElementById('frName').value=this.dataset.rn;document.getElementById('frIni').value=this.dataset.ri;document.getElementById('frRole').value=this.dataset.rr;toast('👤','Freelance rappelé — ajustez les dates')})});
}
function closeFreeMo(){document.getElementById('freeModal').classList.remove('on')}
function saveFree(){
  const name=document.getElementById('frName').value.trim(),ini=document.getElementById('frIni').value.trim().toUpperCase(),role=document.getElementById('frRole').value.trim(),startDate=document.getElementById('frStart').value,endDate=document.getElementById('frEnd').value;
  if(!name||!ini||!role||!startDate||!endDate){toast('⚠️','Tous les champs requis');return}
  if(endDate<startDate){toast('⚠️','Dates invalides');return}
  fRef.push({name,ini,role,startDate,endDate,type:'f'});
  toast('👤',name+' ajouté jusqu\'au '+new Date(endDate+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}));
  closeFreeMo();
}

function openAbsMo(){populateAssignees();document.getElementById('absModal').classList.add('on');document.getElementById('aStart').value=D();document.getElementById('aEnd').value=D();document.getElementById('aNote').value=''}
function closeAbsMo(){document.getElementById('absModal').classList.remove('on')}
function saveAbsMo(){const who=document.getElementById('aPer').value,type=document.getElementById('aTyp').value,start=document.getElementById('aStart').value,end=document.getElementById('aEnd').value,note=document.getElementById('aNote').value;if(!start||!end){toast('⚠️','Dates requises');return}if(end<start){toast('⚠️','Dates invalides');return}addA({who,type,start,end,note});closeAbsMo()}

function switchView(v){curView=v;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));const b=document.querySelector(`.tab[data-v="${v}"]`);if(b)b.classList.add('on');['vPlan','vAbs','vKan'].forEach(id=>document.getElementById(id).classList.remove('on'));document.getElementById('vSalle').classList.remove('on');document.getElementById('hdr').style.display='';if(v==='planning'){document.getElementById('vPlan').classList.add('on');render()}else if(v==='absences'){document.getElementById('vAbs').classList.add('on');rAbs()}else if(v==='kanban'){document.getElementById('vKan').classList.add('on');rKb()}}

document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',function(){switchView(this.dataset.v)})});
document.getElementById('addBtn').addEventListener('click',function(){openMo()});
document.getElementById('addAbsBtn').addEventListener('click',openAbsMo);
document.getElementById('addFreeBtn').addEventListener('click',openFreeMo);
document.getElementById('moCan').addEventListener('click',closeMo);
document.getElementById('moSav').addEventListener('click',saveMo);
document.getElementById('moDelBtn').addEventListener('click',function(){if(editId){delT(editId);closeMo()}});
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeMo()});
document.getElementById('aCan').addEventListener('click',closeAbsMo);
document.getElementById('aSav').addEventListener('click',saveAbsMo);
document.getElementById('absModal').addEventListener('click',function(e){if(e.target===this)closeAbsMo()});
document.getElementById('frCan').addEventListener('click',closeFreeMo);
document.getElementById('frSav').addEventListener('click',saveFree);
document.getElementById('freeModal').addEventListener('click',function(e){if(e.target===this)closeFreeMo()});
document.getElementById('wp').addEventListener('click',function(){weekOff--;updW();rv()});
document.getElementById('wn').addEventListener('click',function(){weekOff++;updW();rv()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeMo();closeAbsMo();closeFreeMo()}});
updW();populateAssignees();
if(salleP){document.getElementById('hdr').style.display='none';document.getElementById('vPlan').classList.remove('on');document.getElementById('vSalle').classList.add('on');curView='salle'}
</script>
