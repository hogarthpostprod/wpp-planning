<html data-type="html" data-identifier="e70d177c-36c4-41cf-8f97-70b17a0c0be4" data-title="Post-Prod Planning - WPP Production" data-version="30" width="1440" height="900"><head>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F5F7FA;--bg2:#fff;--bg3:#EDF0F5;--bg4:#E4E8EE;--navy:#000050;--navy2:#1a1a6e;--bdr:#DEE2E8;--bdr2:#C8CED8;--tx1:#0C1726;--tx2:#4A5568;--tx3:#8896A6;--green:#059669;--yellow:#D97706;--amber:#F59E0B;--red:#DC2626;--violet:#4338CA;--teal:#0891B2;--shadow:0 1px 3px rgba(0,0,80,.06);--shadow2:0 4px 16px rgba(0,0,80,.08);--shadow3:0 12px 40px rgba(0,0,80,.12);--card:#fff;--input:#F8F9FC;--hover:rgba(0,0,80,.025);--r:10px;--rs:6px;--ease:cubic-bezier(.4,0,.2,1)}
[data-theme=dark]{--bg:#0a0a1a;--bg2:#12122a;--bg3:#1a1a3a;--bg4:#22224a;--bdr:rgba(255,255,255,.08);--bdr2:rgba(255,255,255,.12);--tx1:#eef0f6;--tx2:#8892a8;--tx3:#505a6e;--shadow:0 1px 3px rgba(0,0,0,.3);--shadow2:0 4px 16px rgba(0,0,0,.3);--shadow3:0 12px 40px rgba(0,0,0,.4);--card:#12122a;--input:rgba(255,255,255,.04);--hover:rgba(255,255,255,.03)}

/* ═══ SCROLL FIX: html+body always scrollable ═══ */
html{height:auto;min-height:100%;overflow-x:hidden;overflow-y:scroll;-webkit-overflow-scrolling:touch}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx1);min-height:100vh;overflow-x:hidden;overflow-y:visible;-webkit-overflow-scrolling:touch;position:relative;transition:background .3s var(--ease),color .3s var(--ease)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:9px}
::selection{background:rgba(0,0,80,.1)}
@media print{.hdr,.sidebar,.no-print,.ctx,.tt,.undo-bar,.kb-hints{display:none!important}.main{padding:0!important}body{background:#fff!important}}

.hdr{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--bdr);padding:0 20px;display:flex;align-items:center;height:54px;gap:10px;box-shadow:var(--shadow)}
.hdr-logo{height:22px;transition:filter .3s}
[data-theme=dark] .hdr-logo{filter:brightness(0) invert(1)}
.hdr-sep{width:1px;height:26px;background:var(--bdr);margin:0 2px}
.hdr-clock{font:500 12px 'JetBrains Mono',monospace;color:var(--tx3);background:var(--bg3);padding:5px 12px;border-radius:20px;border:1px solid var(--bdr)}
.hdr-sync{font-size:9px;font-weight:600;padding:5px 11px;border-radius:20px;background:rgba(5,150,105,.06);color:var(--green);border:1px solid rgba(5,150,105,.1);display:flex;align-items:center;gap:5px}
.sync-dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-flex{flex:1}
.hdr-search{position:relative}
.hdr-search input{padding:7px 14px 7px 32px;font:500 12px 'Inter',sans-serif;border:1px solid var(--bdr);border-radius:20px;background:var(--bg3);color:var(--tx1);outline:0;width:180px;transition:all .25s var(--ease)}
.hdr-search input:focus{border-color:var(--navy);width:250px;box-shadow:0 0 0 3px rgba(0,0,80,.06)}
.hdr-search::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none}
.tabs{display:flex;gap:2px;background:var(--bg3);padding:3px;border-radius:var(--r);border:1px solid var(--bdr)}
.tab{padding:7px 14px;border:none;background:0;color:var(--tx3);font:600 11px/1 'Inter',sans-serif;border-radius:8px;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
.tab:hover{color:var(--tx2);background:var(--hover)}
.tab.on{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(0,0,80,.2)}
.nav{display:flex;align-items:center;gap:6px}
.nav span{font:700 11px 'Inter',sans-serif;min-width:165px;text-align:center;color:var(--tx2)}
.hbtn{padding:7px 14px;border:none;border-radius:8px;font:600 11px/1 'Inter',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s var(--ease);white-space:nowrap}
.hbtn:active{transform:scale(.96)}
.hicon{width:32px;height:32px;border:1px solid var(--bdr);border-radius:8px;background:var(--bg2);color:var(--tx3);font-size:14px;cursor:pointer;display:grid;place-items:center;transition:all .15s var(--ease)}
.hicon:hover{color:var(--navy);border-color:var(--navy);background:rgba(0,0,80,.03)}
.bp{background:var(--navy);color:#fff}.bp:hover{background:var(--navy2)}
.bv{background:var(--violet);color:#fff}.bg{background:var(--bg2);color:var(--tx2);border:1px solid var(--bdr)}.bg:hover{background:var(--bg3)}
.bo{background:var(--amber);color:#fff}.bt{background:rgba(8,145,178,.08);color:var(--teal);border:1px solid rgba(8,145,178,.15)}
.bd{background:rgba(220,38,38,.06);color:var(--red);border:1px solid rgba(220,38,38,.12)}

/* ═══ MAIN VIEWS — overflow visible, no clipping ═══ */
.main{display:none;padding:16px 20px 60px;overflow:visible}.main.on{display:block}
.filters{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.fsel{padding:7px 11px;font:600 11px 'Inter',sans-serif;border:1px solid var(--bdr);border-radius:8px;background:var(--bg2);color:var(--tx2);cursor:pointer;outline:0}
.layout{display:grid;grid-template-columns:1fr 240px;gap:14px;overflow:visible}
.wgrid{display:grid;gap:1px;background:var(--bdr);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow2)}
.gh{background:var(--bg3);padding:10px 6px;font:700 10px/1.2 'Inter',sans-serif;color:var(--tx3);text-align:center;text-transform:uppercase}
.gh.gh-today{color:var(--navy);background:rgba(0,0,80,.04)}
.gh.gh-today::after{content:'';display:block;width:30px;height:2px;background:var(--navy);border-radius:2px;margin:4px auto 0}
.gh-num{font-size:16px;font-weight:800;display:block;margin-top:2px;color:var(--tx1)}
.gn{background:var(--bg3);padding:10px;font-weight:700;display:flex;align-items:center;gap:8px;border-right:1px solid var(--bdr);cursor:pointer;transition:background .15s;overflow:hidden}
.gn:hover{background:var(--bg4)}
.av{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,80,.1)}
.gn-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gn-role{font-size:8px;color:var(--tx3);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.badge{font-size:7px;font-weight:700;padding:2px 5px;border-radius:3px;text-transform:uppercase}
.b-free{background:rgba(67,56,202,.08);color:var(--violet)}.b-perm{background:rgba(5,150,105,.08);color:var(--green)}
.gc{background:var(--bg2);padding:5px;min-height:68px;position:relative;transition:background .12s}
.gc:hover{background:var(--hover)}.gc.gc-today{background:rgba(0,0,80,.012)}
.gc.gc-abs{display:flex;align-items:center;justify-content:center}.gc.gc-dim{opacity:.12;pointer-events:none}
.gc-add{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;cursor:pointer;display:none;place-items:center;z-index:2;line-height:18px;text-align:center;border:none;box-shadow:0 2px 6px rgba(0,0,80,.2)}
.gc:hover .gc-add{display:grid}
.gc-empty{height:100%;min-height:40px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--tx3);opacity:.2}
.gc-abs-tag{padding:8px 14px;border-radius:var(--rs);font-size:11px;font-weight:700}
.abs-c{background:rgba(6,182,212,.1);color:#0891B2}.abs-o{background:rgba(220,38,38,.08);color:var(--red)}.abs-e{background:rgba(67,56,202,.08);color:var(--violet)}.abs-f{background:rgba(37,99,235,.08);color:#2563EB}.abs-m{background:rgba(220,38,38,.08);color:var(--red)}.abs-t{background:rgba(0,0,80,.06);color:var(--navy)}.abs-p{background:rgba(234,88,12,.08);color:#EA580C}
.cap-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--bg4)}.cap-fill{height:100%;transition:width .4s var(--ease);border-radius:0 2px 2px 0}
.cap-lbl{position:absolute;bottom:5px;right:6px;font:700 8px 'JetBrains Mono',monospace;opacity:.5}
.sort-zone{min-height:30px}
.tk{padding:6px 8px;border-radius:var(--rs);margin-bottom:3px;border-left:3px solid var(--navy);background:var(--bg3);cursor:grab;transition:all .15s var(--ease);user-select:none;-webkit-user-select:none;position:relative}
.tk:hover{background:var(--bg4);transform:translateY(-1px);box-shadow:var(--shadow)}.tk:active{cursor:grabbing}
.tk.t-urg{border-left-color:var(--red);background:rgba(220,38,38,.04)}.tk.t-done{opacity:.3;border-left-color:var(--green)}.tk.t-liv{border-left-color:var(--green);background:rgba(5,150,105,.04)}.tk.t-multi{border-left-color:var(--violet);background:rgba(67,56,202,.04)}
.tk.sortable-ghost{opacity:.25;transform:rotate(1deg)}.tk.sortable-chosen{box-shadow:var(--shadow3);z-index:50;transform:scale(1.02)}
.tk-top{display:flex;align-items:center;gap:4px}
.tk-cli{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.cc-Mondelez{background:rgba(100,50,200,.08);color:#6332c8}.cc-Accor{background:rgba(6,182,212,.08);color:#0891b2}.cc-Allianz{background:rgba(0,0,80,.06);color:var(--navy)}.cc-Herta{background:rgba(5,150,105,.08);color:var(--green)}.cc-def{background:rgba(0,0,80,.04);color:var(--tx2)}
.tk-name{font-weight:700;font-size:10.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx1)}
.tk-acts{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity .12s}.tk:hover .tk-acts{opacity:1}
@media(pointer:coarse){.tk-acts{opacity:.6}.gc-add{display:grid!important;opacity:.7}}
.tk-act{width:20px;height:20px;border:none;border-radius:50%;cursor:pointer;font-size:10px;display:grid;place-items:center;background:0;color:var(--tx3);transition:all .12s}
.tk-act:hover{background:var(--bg4);color:var(--navy)}.tk-act.ta-del:hover{background:rgba(220,38,38,.1);color:var(--red)}
.tk-day{font:700 7.5px 'JetBrains Mono',monospace;background:rgba(67,56,202,.1);color:var(--violet);padding:2px 5px;border-radius:3px;flex-shrink:0}
.tk-bot{font-size:8.5px;color:var(--tx3);margin-top:3px;display:flex;align-items:center;gap:4px}
.tk-info{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-sta{cursor:pointer;font:700 10px 'Inter',sans-serif;border:none;background:0;padding:2px 5px;border-radius:4px;transition:all .12s}.tk-sta:hover{background:var(--bg4);transform:scale(1.15)}
.gs{background:var(--bg3);padding:9px;text-align:center;font:700 10px 'JetBrains Mono',monospace;border-top:2px solid var(--bdr)}
.gs-name{background:var(--bg3);padding:9px;font-size:11px;font-weight:700;color:var(--navy);display:flex;align-items:center;border-right:1px solid var(--bdr)}
.sidebar{display:flex;flex-direction:column;gap:10px;overflow:visible}
.sc{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.sc-t{font:700 10px 'Inter',sans-serif;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.rm{border:1px solid var(--bdr);border-radius:8px;padding:8px;margin-bottom:5px}.rm:hover{border-color:var(--bdr2)}
.rm-t{font:700 9px 'Inter',sans-serif;text-transform:uppercase;color:var(--tx2);margin-bottom:3px}
.rm-sub{font-size:7px;color:var(--tx3);margin-bottom:5px}
.rm-slots{display:flex;gap:3px;flex-wrap:wrap}
.rm-s{background:var(--bg3);border:1px solid var(--bdr);border-radius:5px;padding:5px 7px;font-size:9px;display:flex;align-items:center;gap:4px;flex:1;min-width:45px;cursor:pointer;transition:all .12s}
.rm-s:hover{border-color:var(--navy);background:var(--bg4)}
.rm-dot{width:6px;height:6px;border-radius:50%}.rm-on{background:var(--green);box-shadow:0 0 4px var(--green)}.rm-off{background:var(--bdr2)}
.rm-sn{font:600 8.5px 'Inter',sans-serif;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-bar{display:flex;gap:2px;margin-bottom:8px;background:var(--bg3);padding:3px;border-radius:8px}
.rd{flex:1;padding:4px 3px;border:none;border-radius:6px;background:0;color:var(--tx3);font:600 8px/1.2 'Inter',sans-serif;cursor:pointer;text-align:center;transition:all .12s}
.rd:hover{color:var(--tx1);background:var(--hover)}.rd.rd-on{background:var(--navy);color:#fff}
.rd.rd-today{font-weight:800;position:relative}
.rd.rd-today::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--green)}
.rd.rd-on.rd-today::after{background:#fff}
.rd-num{font-size:12px;font-weight:800;display:block}
.dl{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--bdr)}.dl:last-child{border:0}
.dl-b{font:600 8px 'JetBrains Mono',monospace;min-width:30px;text-align:center;padding:3px 5px;border-radius:5px;flex-shrink:0}
.dl-td{background:rgba(220,38,38,.07);color:var(--red)}.dl-tm{background:rgba(217,119,6,.07);color:var(--yellow)}.dl-lt{background:var(--bg3);color:var(--tx3)}
.pp-i{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--bdr);font-size:10px}

/* ═══ SALLE VIEW — full height, scrollable body ═══ */
.salle{display:none;min-height:100vh;height:auto;background:var(--bg);flex-direction:column;overflow:visible}
.salle.on{display:flex}
.sal-hdr{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);background:var(--bg2);box-shadow:var(--shadow);flex-shrink:0}
.sal-room{font-size:20px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px}
.sal-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sal-date{font-size:12px;color:var(--tx3);margin-top:3px}
.sal-clk{font:700 32px 'JetBrains Mono',monospace;color:var(--navy);opacity:.25}
.sal-body{flex:1;padding:20px 24px;overflow:visible}
.sal-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.sal-ph{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sal-av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:900;color:#fff;box-shadow:0 3px 8px rgba(0,0,80,.12);flex-shrink:0}
.sal-pname{font-size:18px;font-weight:800}
.sal-prole{font-size:11px;color:var(--tx3)}
.sal-cap{margin-left:auto;text-align:right}
.sal-cap-pct{font:800 22px 'JetBrains Mono',monospace}
.sal-cap-bar{width:80px;height:5px;background:var(--bg4);border-radius:9px;overflow:hidden;margin-top:3px}
.sal-cap-fill{height:100%;border-radius:9px}
.sal-tasks{display:flex;flex-direction:column;gap:6px}
.sal-tk{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--bg3);border:1px solid var(--bdr)}
.sal-tk.sal-done{opacity:.4;border-color:rgba(5,150,105,.2);background:rgba(5,150,105,.03)}
.sal-tk-check{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;flex-shrink:0;box-shadow:0 2px 6px rgba(5,150,105,.3)}
.sal-tk-pending{width:26px;height:26px;border-radius:50%;border:2px solid var(--bdr2);background:transparent;flex-shrink:0}
.sal-tk-slot{font:500 10px 'JetBrains Mono',monospace;color:var(--tx3);min-width:80px;text-align:center;background:var(--bg2);padding:4px 6px;border-radius:6px;border:1px solid var(--bdr)}
.sal-tk-proj{flex:1;font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sal-tk-proj.sal-proj-done{text-decoration:line-through;text-decoration-color:var(--green);color:var(--tx3)}
.sal-tk-sta{font-size:10px;font-weight:700;padding:4px 10px;border-radius:10px;flex-shrink:0}
.sal-stats{display:flex;gap:10px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--bdr)}
.sal-stat{font-size:10px;font-weight:700;display:flex;align-items:center;gap:4px}
.sal-stat-dot{width:7px;height:7px;border-radius:50%}
.sal-empty{text-align:center;padding:24px;color:var(--tx3);font-size:14px}
.sal-noassign{text-align:center;padding:50px 30px;color:var(--tx3)}
.sal-noassign-icon{font-size:48px;margin-bottom:12px}
.sal-noassign-title{font-size:18px;font-weight:700;margin-bottom:6px}
.sal-noassign-sub{font-size:12px;opacity:.6}
.sal-footer{padding:10px 24px;border-top:1px solid var(--bdr);display:flex;justify-content:space-between;font-size:10px;color:var(--tx3);background:var(--bg2);flex-shrink:0}
.sal-slot-label{font-size:9px;font-weight:700;color:var(--tx3);padding:2px 7px;border-radius:4px;background:var(--bg3);border:1px solid var(--bdr);margin-left:6px}

.ctx{position:fixed;z-index:600;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--shadow3);min-width:190px;padding:5px;animation:pop .12s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ctx-i{padding:8px 12px;font:500 11px 'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:var(--rs);transition:background .1s}
.ctx-i:hover{background:var(--bg3)}.ctx-i.ctx-d{color:var(--red)}.ctx-i.ctx-d:hover{background:rgba(220,38,38,.06)}
.ctx-sep{height:1px;background:var(--bdr);margin:4px 8px}
.tt{position:fixed;z-index:550;background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:10px 14px;box-shadow:var(--shadow3);pointer-events:none;max-width:260px;animation:pop .1s var(--ease);font-size:10px;line-height:1.5}
.tt-title{font-weight:800;font-size:12px;margin-bottom:4px}.tt-r{color:var(--tx2);margin-bottom:1px}.tt-r b{color:var(--tx1)}
.rdd{position:fixed;z-index:500;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--shadow3);min-width:210px;max-height:270px;overflow-y:auto;padding:5px;animation:pop .12s var(--ease)}
.rdd-i{padding:7px 10px;font:600 10px 'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:var(--rs);transition:background .1s}
.rdd-i:hover{background:var(--bg3)}.rdd-i.rdd-on{background:rgba(0,0,80,.06);color:var(--navy)}
.rdd-libre{color:var(--red);font-style:italic;border-bottom:1px solid var(--bdr);margin-bottom:4px;padding-bottom:8px}
.rdd-av{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:8px;font-weight:800;color:#fff;flex-shrink:0}
