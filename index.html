<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}

.clock{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tx3);background:var(--glass2);padding:4px 10px;border-radius:20px;border:1px solid var(--bdr)}

.wk{display:flex;align-items:center;gap:5px}.wk span{font-size:10px;font-weight:700;min-width:130px;text-align:center;color:var(--tx2)}
.ib{width:26px;height:26px;border:1px solid var(--bdr);border-radius:7px;background:var(--glass);color:var(--tx3);font-size:11px;cursor:pointer;display:grid;place-items:center;transition:.2s}.ib:hover{color:var(--tx1);background:var(--glass2)}
.btn{padding:6px 12px;border:none;border-radius:9px;font:600 10px/1 'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px;transition:.25s;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,var(--indigo),var(--purple));color:#fff;box-shadow:0 2px 12px rgba(99,102,241,.2)}.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(99,102,241,.3)}

.plan-layout{display:grid;grid-template-columns:1fr 210px;gap:12px;overflow:hidden}
.wg{display:grid;gap:1px;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:var(--r2);overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.25)}

.cap-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.03)}.cap-fill{height:100%;transition:width .4s}
.cap-txt{position:absolute;bottom:4px;right:3px;font:700 6px 'JetBrains Mono',monospace;opacity:.7}
.s-ec{color:#fde047}.s-at{color:#c4b5fd}.s-ok{color:#6ee7b7}
.sb{font:700 8px/1 'Inter',sans-serif;padding:3px 8px;border-radius:12px;cursor:pointer;border:none;transition:.2s;white-space:nowrap}.sb:hover{filter:brightness(1.15);transform:scale(1.03)}
.s-ecb{background:rgba(253,224,71,.1);color:#fde047;border:1px solid rgba(253,224,71,.1)}.s-atb{background:rgba(196,181,253,.1);color:#c4b5fd;border:1px solid rgba(196,181,253,.1)}.s-okb{background:rgba(110,231,183,.1);color:#6ee7b7;border:1px solid rgba(110,231,183,.1)}
.side{display:flex;flex-direction:column;gap:10px;overflow:hidden;min-width:0}
.sc{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--bdr);border-radius:var(--r2);padding:12px;overflow:hidden}
.sc-t{font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.rm{border:1px solid var(--bdr);border-radius:var(--r3);padding:8px;margin-bottom:4px;transition:.2s}.rm:last-child{margin:0}.rm:hover{border-color:var(--bdr2)}
.rm-a{border-color:rgba(245,158,11,.12);background:linear-gradient(135deg,rgba(245,158,11,.03),transparent)}.rm-b{border-color:rgba(99,102,241,.12);background:linear-gradient(135deg,rgba(99,102,241,.03),transparent)}

.s-tasks{display:flex;flex-direction:column;gap:5px}

.s-tk-slot{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--tx3);min-width:80px;max-width:80px;text-align:center;background:var(--glass);padding:3px 6px;border-radius:5px;border:1px solid var(--bdr);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-tk-cli{font-size:8px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.s-tk-proj{flex:1;font-size:13px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.s-tk-pp{font-size:8px;color:var(--tx3);padding:0 12px;overflow:hidden}.s-empty{text-align:center;padding:20px;color:var(--tx3);font-size:13px}

.mo{display:none;position:fixed;inset:0;background:rgba(6,6,16,.7);backdrop-filter:blur(8px);z-index:1000;place-items:center}.mo.on{display:grid}
.mo-b{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--bdr2);border-radius:var(--r);padding:22px;width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.6);animation:su .25s ease}
@keyframes su{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.mo-t{font-size:15px;font-weight:800;margin-bottom:16px}.fg{margin-bottom:8px}.fl{display:block;font-size:8px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.fi,.fs{width:100%;padding:8px 12px;background:var(--glass);border:1px solid var(--bdr);border-radius:var(--r3);color:var(--tx1);font:12px/1.4 'Inter',sans-serif;outline:0;transition:.2s}.fi:focus,.fs:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.08)}.fs{cursor:pointer}

.mo-a{display:flex;gap:6px;justify-content:flex-end;margin-top:16px}

.cap-warn.over{display:block;background:rgba(245,158,11,.06);color:#fcd34d;border:1px solid rgba(245,158,11,.12)}

.toast{position:fixed;bottom:16px;right:16px;background:linear-gradient(135deg,var(--bg2),var(--bg1));border:1px solid rgba(110,231,183,.15);border-radius:var(--r2);padding:10px 16px;display:flex;align-items:center;gap:6px;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:2000;transform:translateY(70px);opacity:0;transition:.35s cubic-bezier(.4,0,.2,1);font-size:11px;font-weight:600}.toast.on{transform:translateY(0);opacity:1}
.av{display:grid;place-items:center;font-weight:800;color:#fff;border-radius:8px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.av-g{background:linear-gradient(135deg,#7c3aed,#a78bfa)}.av-m{background:linear-gradient(135deg,#4f46e5,#06b6d4)}.av-a{background:linear-gradient(135deg,#059669,#14b8a6)}

.abs-nm{background:var(--bg2);padding:8px;font-weight:700;display:flex;align-items:center;gap:5px;font-size:10px;overflow:hidden}
.abs-cl{background:var(--bg1);padding:4px;display:flex;align-items:center;justify-content:center}
.abs-tag{font-size:7px;font-weight:700;padding:3px 7px;border-radius:8px;white-space:nowrap}

<div class="mo" id="absModal"><div class="mo-b">
  <div class="mo-t">🏖️ Nouvelle Absence</div>
  <div class="fr"><div class="fg"><label class="fl">Personne</label><select class="fs" id="aPer"><option>Quentin</option><option>Nycolas</option><option>Loick</option><option>Dali</option><option>Léo</option></select></div><div class="fg"><label class="fl">Type</label><select class="fs" id="aTyp"><option value="c">🏖️ Congés</option><option value="o">🔴 OFF</option><option value="e">🎓 École</option><option value="f">📚 Formation</option><option value="m">🤒 Maladie</option><option value="t">🎬 Tournage ext.</option><option value="p">📋 Plénière</option></select></div></div>
  <div class="fr"><div class="fg"><label class="fl">Début</label><input class="fi" type="date" id="aStart"></div><div class="fg"><label class="fl">Fin</label><input class="fi" type="date" id="aEnd"></div></div>
  <div class="fg"><label class="fl">Note</label><input class="fi" id="aNote" placeholder="Optionnel..."></div>
  <div class="mo-a"><button class="btn btn-g" id="aCan">Annuler</button><button class="btn btn-o" id="aSav">💾 Enregistrer</button></div>
</div></div>
<div class="toast" id="toast"><span id="tI">✅</span><span id="tT"></span></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyDT0L4RiFMn3_UWUz18-U9TyP9oYse8dg0",authDomain:"wpp-planning.firebaseapp.com",databaseURL:"https://wpp-planning-default-rtdb.europe-west1.firebasedatabase.app",projectId:"wpp-planning",storageBucket:"wpp-planning.firebasestorage.app",messagingSenderId:"838345318618",appId:"1:838345318618:web:322eef528c7ed1cd95c5e3"});
const db=firebase.database(),tRef=db.ref('tasks'),aRef=db.ref('absences');
const TEAM=[{name:'Quentin',role:'Graphiste',ini:'Q',type:'g',room:'regieb'},{name:'Nycolas',role:'Graphiste',ini:'N',type:'g',room:'regieb'},{name:'Loick',role:'Graphiste',ini:'L',type:'g',room:'regieb'},{name:'Dali',role:'Monteur Réal.',ini:'D',type:'m',room:'regiea'},{name:'Léo',role:'Assist. Monteur',ini:'Lé',type:'a',room:'regieb'}];
const SF=['En cours','En attente','Terminé'],SI={'En cours':'⚡','En attente':'⏳','Terminé':'✅'},SB={'En cours':'s-ecb','En attente':'s-atb','Terminé':'s-okb'},SC={'En cours':'s-ec','En attente':'s-at','Terminé':'s-ok'};
const CC={'Mondelez':'rgba(139,92,246,.12)','Accor':'rgba(6,182,212,.12)','Allianz':'rgba(99,102,241,.12)','Herta':'rgba(16,185,129,.12)','Coca-Cola':'rgba(244,63,94,.12)','GMF':'rgba(249,115,22,.12)','Nestlé':'rgba(245,158,11,.12)',"L'Oréal":'rgba(236,72,153,.12)'};
const AL={'c':'🏖️ Congés','o':'🔴 OFF','e':'🎓 École','f':'📚 Formation','m':'🤒 Maladie','t':'🎬 Tournage','p':'📋 Plénière'};
const ABC={'c':'rgba(245,158,11,.1)','o':'rgba(244,63,94,.1)','e':'rgba(139,92,246,.1)','f':'rgba(6,182,212,.1)','m':'rgba(244,63,94,.12)','t':'rgba(99,102,241,.1)','p':'rgba(249,115,22,.1)'};
const DAY_H=8,MAX_P=120;
function sH(s){if(!s)return 8;if(s.includes('Journée'))return 8;if(s.includes('Matin'))return 3;if(s.includes('Après'))return 5;if(s.includes('10h'))return 1.5;if(s.includes('11h30'))return 1.5;if(s.includes('14h'))return 1.5;if(s.includes('15h30'))return 3.5;if(s==='1h')return 1;if(s==='2h')return 2;return 8}
function dL(w,d,ex){return tasks.filter(t=>t.who===w&&t.date===d&&t.fbId!==ex).reduce((s,t)=>s+sH(t.slot),0)}
function dP(w,d,ex){return Math.round(dL(w,d,ex)/DAY_H*100)}
function cC(p){return p>120?'var(--rose)':p>100?'var(--amber)':p>70?'var(--yellow)':'var(--green)'}
let tasks=[],absences=[],editId=null,weekOff=0,curView='planning';
const salleP=new URLSearchParams(window.location.search).get('salle');
tRef.on('value',s=>{const d=s.val()||{};tasks=Object.entries(d).map(([k,v])=>({...v,fbId:k}));rv()});
aRef.on('value',s=>{const d=s.val()||{};absences=Object.entries(d).map(([k,v])=>({...v,fbId:k}));rv()});
function rv(){if(salleP)return rS();if(curView==='planning')render();else if(curView==='absences')rAbs();else if(curView==='kanban')rKb()}
function D(n=0){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().split('T')[0]}
function isT(s){return s===D()}function isTm(s){return s===D(1)}
function iA(n,d){return absences.find(a=>a.who===n&&d>=a.start&&d<=a.end)}
function isL(t){return t.typ==='Livraison'}
function wkd(o){const n=new Date(),d=n.getDay(),m=new Date(n);m.setDate(n.getDate()-(d===0?6:d-1)+o*7);const r=[];for(let i=0;i<5;i++){const x=new Date(m);x.setDate(m.getDate()+i);r.push(x.toISOString().split('T')[0])}return r}
function wn(s){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w)/864e5-3+(w.getDay()+6)%7)/7)}
function updW(){const w=wkd(weekOff);const f=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});document.getElementById('wl').textContent='S'+wn(w[0])+' · '+f(w[0])+' → '+f(w[4])}
function tick(){const n=new Date(),s=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');document.getElementById('clk').textContent=s;const sc=document.getElementById('sClk');if(sc)sc.textContent=s}
setInterval(tick,1e3);tick();
function toast(i,t){const el=document.getElementById('toast');document.getElementById('tI').textContent=i;document.getElementById('tT').textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),3e3)}
function avC(p){return p.type==='g'?'av-g':p.type==='m'?'av-m':'av-a'}
function avBg(p){return p.type==='g'?'linear-gradient(135deg,#7c3aed,#a78bfa)':p.type==='m'?'linear-gradient(135deg,#4f46e5,#06b6d4)':'linear-gradient(135deg,#059669,#14b8a6)'}
function addT(t){tRef.push(t);toast('✅','Synchronisée')}
function updT(id,d){tRef.child(id).update(d)}
function delT(id){tRef.child(id).remove();toast('🗑','Tâche supprimée')}
function addA(a){aRef.push(a);toast('🏖️','Enregistrée')}
function delA(id){aRef.child(id).remove();toast('🗑','Supprimée')}
function cyc(fbId){const t=tasks.find(x=>x.fbId===fbId);if(!t)return;const ns=SF[(SF.indexOf(t.sta)+1)%SF.length];updT(fbId,{sta:ns});if(ns==='Terminé')toast('✅',t.who+' a terminé '+t.proj)}

// ═══ WEEKLY GRID with delete button on each task ═══
function render(){
  const dates=wkd(weekOff);const dn=['LUN','MAR','MER','JEU','VEN'];
  let h=`<div class="wg" style="grid-template-columns:100px repeat(5,1fr)"><div class="wg-h" style="font-size:7px;line-height:1.3">10h → 19h<br>⏸ 13h-14h</div>`;
  dates.forEach((d,i)=>{const dd=new Date(d+'T12:00:00');h+=`<div class="wg-h${isT(d)?' today':''}">${dn[i]}<br><span style="font-size:12px;font-weight:800">${dd.getDate()}</span><span style="font-size:7px;opacity:.5">/${dd.getMonth()+1}</span></div>`});
  TEAM.forEach(p=>{
    h+=`<div class="wg-name"><div class="av ${avC(p)}" style="width:24px;height:24px;font-size:9px">${p.ini}</div><div style="min-width:0"><div style="font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</div><div style="font-size:7px;color:var(--tx3)">${p.role}</div></div></div>`;
    dates.forEach(d=>{
      const ab=iA(p.name,d);const tdy=isT(d)?' today-col':'';
      if(ab){h+=`<div class="wg-cell abs-cell${tdy}"><div class="wg-abs" style="background:${ABC[ab.type]}">${AL[ab.type]}</div></div>`;return}
      const dt=tasks.filter(t=>t.who===p.name&&t.date===d).sort((a,b)=>SF.indexOf(a.sta)-SF.indexOf(b.sta));
      const pct=dP(p.name,d);const cc=cC(pct);
      h+=`<div class="wg-cell${tdy}">`;
      if(!dt.length)h+=`<div class="wg-empty">—</div>`;
      else dt.forEach(t=>{
        const uc=t.pri==='Urgent'?' urgent':'';const dc=t.sta==='Terminé'?' done':'';const lv=isL(t)?' livraison':'';
        h+=`<div class="wg-task${uc}${dc}${lv}" data-id="${t.fbId}">
          <div class="wg-top">
            <div class="wg-proj">${isL(t)?'🚀 ':''}${t.proj}</div>
            <button class="wg-del" data-did="${t.fbId}">✕</button>
          </div>
          <div class="wg-info">
            <span class="wg-info-left">${t.typ}${t.slot&&t.slot!=='Journée'?' · '+t.slot:''}${t.pp?' · 📋'+t.pp:''}</span>
            <button class="wg-sb ${SC[t.sta]}" data-sid="${t.fbId}">${SI[t.sta]}</button>
          </div>
        </div>`;
      });
      if(dt.length)h+=`<div class="cap-bar"><div class="cap-fill" style="width:${Math.min(pct,120)}%;background:${cc}"></div></div><div class="cap-txt" style="color:${cc}">${pct}%</div>`;
      h+=`</div>`;
    });
  });
  h+=`</div>`;document.getElementById('weekGrid').innerHTML=h;
  document.querySelectorAll('.wg-sb[data-sid]').forEach(b=>{b.addEventListener('click',function(e){e.stopPropagation();cyc(this.dataset.sid)})});
  document.querySelectorAll('.wg-del[data-did]').forEach(b=>{b.addEventListener('click',function(e){e.stopPropagation();if(confirm('Supprimer cette tâche ?'))delT(this.dataset.did)})});
  document.querySelectorAll('.wg-task[data-id]').forEach(el=>{el.addEventListener('dblclick',function(){openMo(this.dataset.id)})});
  rRm();rDl();
}

function rRm(){const td=tasks.filter(t=>t.date===D()&&t.sta!=='Terminé');const has=n=>td.some(t=>t.who===n)&&!iA(n,D());const hasPz=td.some(t=>t.typ==='Présentation'||(t.note&&(t.note+'').toLowerCase().includes('régie a')));const pzW=hasPz?td.find(t=>t.typ==='Présentation'||(t.note&&(t.note+'').toLowerCase().includes('régie a'))):null;document.getElementById('rooms').innerHTML=`<div class="rm rm-a"><div class="rm-l">⭐ Régie A</div><div class="rm-ps"><div class="rp"><span class="rp-d ${hasPz?'rp-pz':'rp-off'}"></span><span style="font-size:8px;font-weight:600">${pzW?pzW.who:'Libre'}</span></div></div></div><div class="rm rm-b"><div class="rm-l">🎬 Régie B</div><div class="rm-ps"><div class="rp"><span class="rp-d ${has('Quentin')?'rp-on':'rp-off'}"></span><span style="font-size:8px">Q</span></div><div class="rp"><span class="rp-d ${has('Nycolas')?'rp-on':'rp-off'}"></span><span style="font-size:8px">N</span></div><div class="rp"><span class="rp-d ${has('Loick')?'rp-on':'rp-off'}"></span><span style="font-size:8px">L</span></div><div class="rp"><span class="rp-d ${has('Léo')?'rp-on':'rp-off'}"></span><span style="font-size:8px">Lé</span></div></div></div>`}
function rDl(){const up=tasks.filter(t=>isL(t)&&t.sta!=='Terminé'&&t.date>=D()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);document.getElementById('deliv').innerHTML=up.length?up.map(t=>{const c=isT(t.date)?'dl-td':isTm(t.date)?'dl-tm':'dl-lt';const l=isT(t.date)?'AUJ':isTm(t.date)?'DEM':new Date(t.date+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});return`<div class="dl"><span class="dl-d ${c}">${l}</span><div class="dl-info"><div class="dl-p">🚀 ${t.proj}</div><div class="dl-a">→ ${t.who}${t.pp?' · 📋'+t.pp:''}</div></div></div>`}).join(''):'<div style="text-align:center;color:var(--tx3);font-size:9px;padding:10px;opacity:.4">Aucune livraison</div>'}

function rAbs(){const dates=wkd(weekOff);const dn=['LUN','MAR','MER','JEU','VEN'];let h=`<div class="abs-grid" style="grid-template-columns:100px repeat(5,1fr)"><div class="abs-h"></div>`;dates.forEach((d,i)=>{const dd=new Date(d+'T12:00:00');h+=`<div class="abs-h${isT(d)?' today':''}">${dn[i]} <span style="font-size:11px;font-weight:800">${dd.getDate()}</span>/${dd.getMonth()+1}</div>`});TEAM.forEach(p=>{h+=`<div class="abs-nm"><div class="av ${avC(p)}" style="width:20px;height:20px;font-size:8px">${p.ini}</div>${p.name}</div>`;dates.forEach(d=>{const ab=iA(p.name,d);h+=`<div class="abs-cl">${ab?`<span class="abs-tag" style="background:${ABC[ab.type]}">${AL[ab.type]}</span>`:''}</div>`})});h+='</div>';h+='<div style="margin-top:12px;background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--bdr);border-radius:var(--r2);padding:14px"><div class="sc-t">📅 Liste</div>';const sorted=[...absences].sort((a,b)=>(a.start||'').localeCompare(b.start||''));sorted.forEach(a=>{const s=new Date(a.start+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});const e=new Date(a.end+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});const days=Math.round((new Date(a.end)-new Date(a.start))/864e5)+1;h+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bdr)"><span class="abs-tag" style="background:${ABC[a.type]};min-width:55px;text-align:center">${AL[a.type]}</span><span style="font-size:11px;font-weight:700">${a.who}</span><span style="font-size:9px;color:var(--tx3);flex:1">${s} → ${e} (${days}j)${a.note?' · '+a.note:''}</span><button class="btn btn-d" style="padding:2px 6px;font-size:7px" data-adel="${a.fbId}">✕</button></div>`});if(!sorted.length)h+='<div style="text-align:center;color:var(--tx3);font-size:10px;padding:12px;opacity:.4">Aucune absence</div>';h+='</div>';document.getElementById('absCal').innerHTML=h;document.querySelectorAll('[data-adel]').forEach(b=>{b.addEventListener('click',function(){delA(this.dataset.adel)})})}

function rKb(){const w=wkd(weekOff),wt=tasks.filter(t=>w.includes(t.date));document.getElementById('kboard').innerHTML=SF.map(s=>{const st=wt.filter(t=>t.sta===s);const bc=s==='Terminé'?'var(--green)':s==='En cours'?'var(--amber)':'var(--indigo)';return`<div><div style="font-size:10px;font-weight:700;color:var(--tx2);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid ${bc}">${SI[s]} ${s} <span style="opacity:.4">(${st.length})</span></div>${st.map(t=>`<div style="background:linear-gradient(135deg,var(--bg2),var(--bg1));border:1px solid var(--bdr);border-radius:var(--r3);padding:10px;margin-bottom:6px${isL(t)?';border-left:3px solid var(--cyan)':''}"><div style="display:flex;justify-content:space-between"><div style="font-size:7px;font-weight:700;color:var(--tx3);text-transform:uppercase">${t.cli}${t.pp?' · 📋'+t.pp:''}</div><button class="wg-del" data-kdel="${t.fbId}" style="opacity:.6">✕</button></div><div style="font-size:10px;font-weight:700;margin:3px 0">${isL(t)?'🚀 ':''}${t.proj}</div><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:7px;color:var(--tx3)">${t.who} · ${t.typ}</span><button class="sb ${SB[t.sta]}" data-kid="${t.fbId}">${SI[t.sta]}</button></div></div>`).join('')}</div>`}).join('');document.querySelectorAll('[data-kid]').forEach(b=>{b.addEventListener('click',function(){cyc(this.dataset.kid)})});document.querySelectorAll('[data-kdel]').forEach(b=>{b.addEventListener('click',function(e){e.stopPropagation();if(confirm('Supprimer ?'))delT(this.dataset.kdel)})})}

function rS(){const room=salleP;const isA=room==='regiea';const rN=isA?'Régie A — Présentation':'Régie B — Production';const rC=isA?'var(--amber)':'var(--indigo)';const n=new Date();const dayN=n.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const rPpl=TEAM.filter(p=>p.room===room);const td=tasks.filter(t=>t.date===D()&&t.sta!=='Terminé');const prezT=isA?td.filter(t=>t.typ==='Présentation'||(t.note&&(t.note+'').toLowerCase().includes('régie a'))):[];const allN=[...new Set([...rPpl.map(p=>p.name),...prezT.map(t=>t.who)])];let cards='';allN.forEach(name=>{const p=TEAM.find(x=>x.name===name);if(!p)return;const ab=iA(name,D());const pt=td.filter(t=>t.who===name);const pct=dP(name,D());const cc=cC(pct);let tH='';if(ab)tH=`<div class="s-empty">${AL[ab.type]}</div>`;else if(!pt.length)tH=`<div class="s-empty">Pas de tâche</div>`;else tH='<div class="s-tasks">'+pt.map(t=>`<div class="s-tk"><div class="s-tk-slot">${t.slot||'Journée'}</div><div class="s-tk-cli" style="background:${CC[t.cli]||'var(--glass2)'}">${t.cli}</div><div class="s-tk-proj">${isL(t)?'🚀 ':''}${t.proj}</div><div class="s-tk-type">${t.typ}</div><div class="s-tk-sta ${SB[t.sta]}">${SI[t.sta]} ${t.sta}</div></div>${t.pp?`<div class="s-tk-pp">📋 ${t.pp}</div>`:''}`).join('')+'</div>';cards+=`<div class="s-person" ${ab?'style="opacity:.35"':''}><div class="s-ph"><div class="s-av" style="background:${avBg(p)}">${p.ini}</div><div><div class="s-pn">${p.name}</div><div class="s-pr">${p.role}</div></div>${ab?`<div style="margin-left:auto;font-size:11px;font-weight:700;padding:5px 14px;border-radius:20px;background:${ABC[ab.type]}">${AL[ab.type]}</div>`:`<div class="s-cap"><div class="s-cap-pct" style="color:${cc}">${pct}%</div><div class="s-cap-bar"><div class="s-cap-fill" style="width:${Math.min(pct,120)}%;background:${cc}"></div></div></div>`}</div>${tH}</div>`});if(!allN.length)cards=`<div class="s-empty">Personne dans cette salle</div>`;const up=tasks.filter(t=>isL(t)&&t.sta!=='Terminé'&&t.date>=D()&&allN.includes(t.who)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);const dlH=up.map(t=>{const l=isT(t.date)?'AUJ':isTm(t.date)?'DEM':new Date(t.date+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});return`<span style="font-size:9px;background:var(--glass2);padding:3px 10px;border-radius:12px;border:1px solid var(--bdr)">🚀 ${l} · ${t.proj}</span>`}).join(' ')||'Aucune';document.getElementById('vSalle').innerHTML=`<div class="s-hdr"><div><div class="s-logo">WPP PRODUCTION</div><div class="s-date">${dayN}</div></div><div class="s-room"><span class="s-dot" style="background:${rC};box-shadow:0 0 10px ${rC}"></span>${rN}</div><div class="s-clk" id="sClk">${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}</div></div><div class="s-body">${cards}</div><div class="s-footer"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">📤 ${dlH}</div><div style="display:flex;align-items:center;gap:4px;flex-shrink:0"><span class="sync-dot"></span>Temps réel</div></div>`}

function checkCap(){const who=document.getElementById('fAss').value,date=document.getElementById('fDat').value,slot=document.getElementById('fSlo').value;if(!who||!date)return;const tot=Math.round((dL(who,date,editId)+sH(slot))/DAY_H*100);const w=document.getElementById('capWarn');if(tot>MAX_P){w.className='cap-warn blocked';w.textContent=`🔴 BLOQUÉ — ${who} serait à ${tot}% (max ${MAX_P}%)`;w.style.display='block'}else if(tot>100){w.className='cap-warn over';w.textContent=`⚠️ Surcharge — ${who} à ${tot}%`;w.style.display='block'}else{w.style.display='none'}}
function openMo(id){editId=id||null;document.getElementById('modal').classList.add('on');document.getElementById('moTitle').textContent=id?'✏️ Modifier':'✨ Nouvelle Tâche';document.getElementById('moDelBtn').style.display=id?'flex':'none';document.getElementById('capWarn').style.display='none';if(id){const t=tasks.find(x=>x.fbId===id);if(!t)return;document.getElementById('fProj').value=t.proj||'';document.getElementById('fCli').value=t.cli||'Autre';document.getElementById('fAss').value=t.who||'Quentin';document.getElementById('fPP').value=t.pp||'';document.getElementById('fTyp').value=t.typ||'Motion';document.getElementById('fSta').value=t.sta||'En cours';document.getElementById('fDat').value=t.date||D();document.getElementById('fSlo').value=t.slot||'Journée';document.getElementById('fPri').value=t.pri||'Normal';document.getElementById('fNot').value=t.note||''}else{document.getElementById('fProj').value='';document.getElementById('fDat').value=D();document.getElementById('fSta').value='En cours';document.getElementById('fPri').value='Normal';document.getElementById('fPP').value='';document.getElementById('fNot').value='';document.getElementById('fSlo').value='Journée'}setTimeout(checkCap,50)}
function closeMo(){document.getElementById('modal').classList.remove('on');editId=null}
function saveMo(){const proj=document.getElementById('fProj').value.trim();if(!proj){toast('⚠️','Projet requis');return}const who=document.getElementById('fAss').value,date=document.getElementById('fDat').value,slot=document.getElementById('fSlo').value;const tot=Math.round((dL(who,date,editId)+sH(slot))/DAY_H*100);if(tot>MAX_P){toast('🔴',`Bloqué: ${who} à ${tot}%`);return}if(iA(who,date)){toast('⚠️',who+' est absent !');return}const d={proj,cli:document.getElementById('fCli').value,who,pp:document.getElementById('fPP').value,typ:document.getElementById('fTyp').value,sta:document.getElementById('fSta').value,date,slot,pri:document.getElementById('fPri').value,note:document.getElementById('fNot').value};if(editId)updT(editId,d);else addT(d);closeMo()}
