<script>
firebase.initializeApp({apiKey:"AIzaSyDT0L4RiFMn3_UWUz18-U9TyP9oYse8dg0",authDomain:"wpp-planning.firebaseapp.com",databaseURL:"https://wpp-planning-default-rtdb.europe-west1.firebasedatabase.app",projectId:"wpp-planning",storageBucket:"wpp-planning.firebasestorage.app",messagingSenderId:"838345318618",appId:"1:838345318618:web:322eef528c7ed1cd95c5e3"});
const db=firebase.database(),tRef=db.ref('tasks'),aRef=db.ref('absences'),fRef=db.ref('freelances'),cRef=db.ref('clients'),rRef=db.ref('rooms');
const TF=[{name:'Quentin',role:'Graphiste',ini:'Q',type:'g',fixed:true},{name:'Nycolas',role:'Graphiste',ini:'N',type:'g',fixed:true},{name:'Loick',role:'Graphiste',ini:'L',type:'g',fixed:true},{name:'Dali',role:'Monteur Réal.',ini:'D',type:'m',fixed:true},{name:'Léo',role:'Assist. Monteur',ini:'Lé',type:'a',fixed:true}];
const PP_FIXED=[{name:'Florence',ini:'Fl',fixed:true},{name:'Séverine',ini:'Sé',fixed:true},{name:'Marion',ini:'Ma',fixed:true},{name:'Diane',ini:'Di',fixed:true},{name:'Mia',ini:'Mi',fixed:true},{name:'JC',ini:'JC',fixed:true}];
const PERM_END='9999-12-31';
const DC=['Mondelez','Accor','Allianz','Herta','Coca-Cola','Nestlé',"L'Oréal",'GMF','Generali','Atlantic'];
const SF=['En cours','En attente','Terminé'],SI={'En cours':'⚡','En attente':'⏳','Terminé':'✅'},SB={'En cours':'s-ecb','En attente':'s-atb','Terminé':'s-okb'},SC={'En cours':'s-ec','En attente':'s-at','Terminé':'s-ok'};
const AL={'c':'🏖️ Congés','o':'🔴 OFF','e':'🎓 École','f':'📚 Formation','m':'🤒 Maladie','t':'🎬 Tournage','p':'📋 Plénière'};
const ABC={'c':'abs-c','o':'abs-o','e':'abs-e','f':'abs-f','m':'abs-m','t':'abs-t','p':'abs-p'};
const ROOM_NAMES={regieA:'Régie A',regieB_p1:'Régie B · P1',regieB_p2:'Régie B · P2',regieB_p3:'Régie B · P3',assistant:'Assistant'};
const DAY_H=8,MAX_P=120;
function sH(s){if(!s)return 8;if(s.includes('Journée'))return 8;if(s.includes('Matin'))return 3;if(s.includes('Après'))return 5;if(s.includes('10h'))return 1.5;if(s.includes('11h30'))return 1.5;if(s.includes('14h'))return 1.5;if(s.includes('15h30'))return 3.5;if(s==='1h')return 1;if(s==='2h')return 2;return 8}
function tOn(t,d){return d>=t.date&&d<=(t.dateEnd||t.date)}
function isMD(t){return t.dateEnd&&t.dateEnd>t.date}
function tD(t){return isMD(t)?Math.round((new Date(t.dateEnd)-new Date(t.date))/864e5)+1:1}
function tDN(t,d){return isMD(t)?Math.round((new Date(d)-new Date(t.date))/864e5)+1:0}
function tHr(t){return isMD(t)?8:sH(t.slot)}
function dL(w,d,ex){return tasks.filter(t=>t.who===w&&tOn(t,d)&&t.fbId!==ex).reduce((s,t)=>s+tHr(t),0)}
function dP(w,d,ex){return Math.round(dL(w,d,ex)/DAY_H*100)}
function cCol(p){return p>120?'var(--red)':p>100?'var(--amber)':p>70?'var(--yellow)':'var(--green)'}
function cliCls(c){return['Mondelez','Accor','Allianz','Herta'].includes(c)?'cc-'+c:'cc-default'}
function fmtDS(d){return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
function isPerm(f){return f.permanent===true||f.endDate===PERM_END}
let tasks=[],absences=[],freelances=[],clients=[...DC],roomData={},editId=null,weekOff=0,curView='planning',searchQ='',selectedRoomDay=null,openDropSlot=null;
const salleP=new URLSearchParams(window.location.search).get('salle');

function gTeam(dates){const gF=freelances.filter(f=>(f.category||'graphiste')==='graphiste');const act=gF.filter(f=>isPerm(f)||!dates||dates.some(d=>d>=f.startDate&&d<=f.endDate));return[...TF,...act.map(f=>({name:f.name,role:f.role||'Graphiste',ini:f.ini,type:'f',fixed:false,permanent:isPerm(f),fbId:f.fbId}))]}
function gPP(dates){const ppF=freelances.filter(f=>f.category==='postprod');const act=ppF.filter(f=>isPerm(f)||!dates||dates.some(d=>d>=f.startDate&&d<=f.endDate));return[...PP_FIXED.map(p=>({...p,fixed:true,permanent:true})),...act.map(f=>({name:f.name,ini:f.ini,fixed:false,permanent:isPerm(f),fbId:f.fbId}))]}
function popAss(){const t=gTeam();['fAss','aPer'].forEach(id=>{const s=document.getElementById(id);if(s)s.innerHTML=t.map(p=>`<option>${p.name}</option>`).join('')});const fp=document.getElementById('filterPerson');if(fp){const v=fp.value;fp.innerHTML='<option value="">Tous</option>'+t.map(p=>`<option>${p.name}</option>`).join('');fp.value=v}}
function popPP(){const pp=gPP();const sel=document.getElementById('fPP');if(sel)sel.innerHTML='<option value="">—</option>'+pp.map(p=>`<option>${p.name}</option>`).join('')}
function updCL(){const dl=document.getElementById('cL');if(dl)dl.innerHTML=[...new Set(clients)].sort().map(c=>`<option value="${c}">`).join('');const fc=document.getElementById('filterClient');if(fc){const v=fc.value;fc.innerHTML='<option value="">Tous clients</option>'+[...new Set(clients)].sort().map(c=>`<option>${c}</option>`).join('');fc.value=v}}

tRef.on('value',s=>{const d=s.val()||{};tasks=Object.entries(d).map(([k,v])=>({...v,fbId:k}));rv()});
aRef.on('value',s=>{const d=s.val()||{};absences=Object.entries(d).map(([k,v])=>({...v,fbId:k}));rv()});
fRef.on('value',s=>{const d=s.val()||{};freelances=Object.entries(d).map(([k,v])=>({...v,fbId:k}));popAss();popPP();rv()});
cRef.on('value',s=>{const d=s.val()||{};clients=[...new Set([...DC,...Object.values(d)])];updCL()});
rRef.on('value',s=>{roomData=s.val()||{};rRm()});

function rv(){if(salleP)return rS();if(curView==='planning')render();else if(curView==='absences')rAbs();else if(curView==='kanban')rKb()}
function D(n=0){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().split('T')[0]}
function isT(s){return s===D()}function isTm(s){return s===D(1)}
function iA(n,d){return absences.find(a=>a.who===n&&d>=a.start&&d<=a.end)}
function isL(t){return t.typ==='Livraison'}
function wkd(o){const n=new Date(),d=n.getDay(),m=new Date(n);m.setDate(n.getDate()-(d===0?6:d-1)+o*7);const r=[];for(let i=0;i<5;i++){const x=new Date(m);x.setDate(m.getDate()+i);r.push(x.toISOString().split('T')[0])}return r}
function wn(s){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w)/864e5-3+(w.getDay()+6)%7)/7)}
function updW(){const w=wkd(weekOff);const f=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});document.getElementById('wl').textContent='S'+wn(w[0])+' · '+f(w[0])+' → '+f(w[4]);if(!selectedRoomDay||!w.includes(selectedRoomDay))selectedRoomDay=w.find(d=>isT(d))||w[0]}
function tick(){const n=new Date(),s=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');document.getElementById('clk').textContent=s;const sc=document.getElementById('sClk');if(sc)sc.textContent=s}
setInterval(tick,1e3);tick();
function toast(i,t){const el=document.getElementById('toast');document.getElementById('tI').textContent=i;document.getElementById('tT').textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),3e3)}
function avC(p){return p.type==='g'?'av-g':p.type==='m'?'av-m':p.type==='f'?'av-f':'av-a'}
function avBg(p){return p.type==='g'?'linear-gradient(135deg,#000050,#1a1a6e)':p.type==='m'?'linear-gradient(135deg,#1e3a5f,#2563eb)':p.type==='f'?'linear-gradient(135deg,#4338CA,#6d28d9)':'linear-gradient(135deg,#059669,#14b8a6)'}
function addT(t){tRef.push(t);if(t.cli&&!clients.includes(t.cli))cRef.push(t.cli);toast('✅','Synchronisée')}
function updT(id,d){tRef.child(id).update(d);if(d.cli&&!clients.includes(d.cli))cRef.push(d.cli)}
function delT(id){tRef.child(id).remove();toast('🗑','Supprimée')}
function dupT(id){const t=tasks.find(x=>x.fbId===id);if(!t)return;const{fbId,...d}=t;addT(d);toast('📋','Dupliquée')}
function addA(a){aRef.push(a);toast('🏖️','Enregistrée')}
function delA(id){aRef.child(id).remove();toast('🗑','Supprimée')}
function delFree(id){fRef.child(id).remove();toast('🗑','Retiré·e')}
function cyc(fbId){const t=tasks.find(x=>x.fbId===fbId);if(!t)return;const ns=SF[(SF.indexOf(t.sta)+1)%SF.length];const upd={sta:ns};if(ns==='Terminé')upd.doneDate=D();else upd.doneDate=null;updT(fbId,upd);if(ns==='Terminé')toast('✅',t.who+' a terminé '+t.proj)}
function matchesFilters(t){const fP=document.getElementById('filterPerson').value,fC=document.getElementById('filterClient').value,fT=document.getElementById('filterType').value;if(fP&&t.who!==fP)return false;if(fC&&t.cli!==fC)return false;if(fT&&t.typ!==fT)return false;if(searchQ){const q=searchQ.toLowerCase();if(!((t.proj||'').toLowerCase().includes(q)||(t.cli||'').toLowerCase().includes(q)||(t.who||'').toLowerCase().includes(q)||(t.typ||'').toLowerCase().includes(q)))return false}return true}

// ═══ ROOM ASSIGNMENT ═══
function getRoomSlot(date,slot){return(roomData[date]||{})[slot]||''}

</div></div>`});if(dt.length)h+=`<div class="cap-bar"><div class="cap-fill" style="width:${Math.min(pct,120)}%;background:${cc}"></div></div><div class="cap-txt" style="color:${cc}">${pct}%</div>`;h+=`</div>`})});
  h+=`<div class="wg-summary-name">📊 Total</div>`;dates.forEach(d=>{const t2=gTeam([d]);const fP=document.getElementById('filterPerson').value;let tH=0,tC=0,lC=0;t2.forEach(p=>{if(fP&&p.name!==fP)return;if(iA(p.name,d))return;tH+=dL(p.name,d);tC+=DAY_H;lC+=tasks.filter(t=>t.who===p.name&&tOn(t,d)&&isL(t)&&t.sta!=='Terminé').length});const avg=tC?Math.round(tH/tC*100):0;h+=`<div class="wg-summary" style="color:${cCol(avg)}">${avg}%${lC?` · 🚀${lC}`:''}</div>`});h+=`</div>`;
  document.getElementById('weekGrid').innerHTML=h;
  document.querySelectorAll('.wg-sb[data-sid]').forEach(b=>{b.addEventListener('click',function(e){e.stopPropagation();cyc(this.dataset.sid)})});
  document.querySelectorAll('.wg-del[data-did]').forEach(b=>{b.addEventListener('click',function(e){e.stopPropagation();delT(this.dataset.did)})});
  document.querySelectorAll('.wg-dup[data-dupid]').forEach(b=>{b.addEventListener('click',function(e){e.stopPropagation();dupT(this.dataset.dupid)})});

// ═══ ROOMS WITH DAY SELECTOR + INTERACTIVE SLOTS ═══
function rRm(){
  const dates=wkd(weekOff);const dn=['L','M','M','J','V'];
  if(!selectedRoomDay||!dates.includes(selectedRoomDay))selectedRoomDay=dates.find(d=>isT(d))||dates[0];
  const team=gTeam(dates);const dayR=roomData[selectedRoomDay]||{};
  // Day selector
  let dh='<div class="room-days">';
  dates.forEach((d,i)=>{const dd=new Date(d+'T12:00:00');const on=d===selectedRoomDay;const td=isT(d);dh+=`<button class="room-day${on?' rd-on':''}${td?' rd-today':''}" data-rd="${d}"><span>${dn[i]}</span><span class="room-day-num">${dd.getDate()}</span></button>`});
  dh+='</div>';
  document.getElementById('roomDays').innerHTML=dh;
  document.querySelectorAll('.room-day').forEach(b=>{b.addEventListener('click',function(){selectedRoomDay=this.dataset.rd;rRm()})});

  // Slot builder
  function slot(slotId,label){
    const who=dayR[slotId]||'';const p=who?team.find(x=>x.name===who):null;const isOpen=openDropSlot===slotId;
    let s=`<div class="rp" data-rslot="${slotId}" style="position:relative${who?';border-color:rgba(5,150,105,.3)':''}">`;
    s+=`<span class="rp-d ${who?'rp-on':'rp-off'}"></span>`;
    if(label)s+=`<span class="rp-label">${label}</span>`;
    s+=`<span class="rp-name" style="${who?'color:var(--tx1);font-weight:700':'color:var(--tx3);font-style:italic'}">${who||'Libre'}</span>`;
    if(isOpen){
      s+=`<div class="room-dd">`;
      s+=`<div class="room-dd-item rdd-libre" data-rset="" data-rslot2="${slotId}">✕ Libérer le poste</div>`;
      team.forEach(tp=>{const isAbs=iA(tp.name,selectedRoomDay);const isCur=tp.name===who;if(isAbs)return;s+=`<div class="room-dd-item${isCur?' rdd-active':''}" data-rset="${tp.name}" data-rslot2="${slotId}"><div class="room-dd-av" style="background:${avBg(tp)}">${tp.ini}</div><span>${tp.name}</span><span style="font-size:5px;color:var(--tx3)">${tp.role}</span></div>`});
      s+=`</div>`;
    }
    s+=`</div>`;return s;
  }

  const occ=Object.values(dayR).filter(Boolean).length;
  let h=`<div class="rm"><div class="rm-l">⭐ Régie A</div><div class="rm-sub">Présentation + Double écran</div><div class="rm-ps">${slot('regieA','')}</div></div>`;
  h+=`<div class="rm"><div class="rm-l">🎬 Régie B</div><div class="rm-sub">3 postes + Double écran</div><div class="rm-ps">${slot('regieB_p1','P1')}${slot('regieB_p2','P2')}${slot('regieB_p3','P3')}</div></div>`;
  h+=`<div class="rm"><div class="rm-l">📎 Assistant</div><div class="rm-ps">${slot('assistant','')}</div></div>`;
  h+=`<div style="margin-top:4px;font-size:7px;color:var(--tx3);text-align:center">${occ} poste${occ>1?'s':''} occupé${occ>1?'s':''} · ${fmtDS(selectedRoomDay)}</div>`;
  document.getElementById('rooms').innerHTML=h;

  // Slot click → toggle dropdown
  document.querySelectorAll('.rp[data-rslot]').forEach(el=>{
    el.addEventListener('click',function(e){
      if(e.target.closest('.room-dd'))return;
      const s=this.dataset.rslot;
      openDropSlot=openDropSlot===s?null:s;
      rRm();
    });
  });
  // Dropdown item click → assign
  document.querySelectorAll('.room-dd-item[data-rslot2]').forEach(el=>{
    el.addEventListener('click',function(e){
      e.stopPropagation();
      setRoomSlot(selectedRoomDay,this.dataset.rslot2,this.dataset.rset);
      openDropSlot=null;
    });
  });
}

function rPPSide(){const pp=gPP([D()]);const el=document.getElementById('ppList');if(!el)return;el.innerHTML=pp.map(p=>{const badge=p.fixed?'':'<span style="font-size:5px;font-weight:700;padding:1px 3px;border-radius:2px;'+(p.permanent?'background:rgba(5,150,105,.08);color:var(--green)':'background:rgba(8,145,178,.08);color:var(--teal)')+'">'+(p.permanent?'PERM':'TEMP')+'</span>';return`<div style="display:flex;align-items:center;gap:4px;padding:3px 0;border-bottom:1px solid var(--bdr);font-size:8px"><div class="av av-pp" style="width:16px;height:16px;font-size:6px">${p.ini||p.name[0]}</div><span style="font-weight:600;flex:1">${p.name}</span>${badge}</div>`}).join('')}
function rDl(){const up=tasks.filter(t=>isL(t)&&t.sta!=='Terminé'&&(t.dateEnd||t.date)>=D()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);document.getElementById('deliv').innerHTML=up.length?up.map(t=>{const c=isT(t.date)?'dl-td':isTm(t.date)?'dl-tm':'dl-lt';const l=isT(t.date)?'AUJ':isTm(t.date)?'DEM':new Date(t.date+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});return`<div class="dl"><span class="dl-d ${c}">${l}</span><div class="dl-info"><div class="dl-p">🚀 ${t.proj}</div><div class="dl-a">${t.who}${t.pp?' · 📋'+t.pp:''}</div></div></div>`}).join(''):'<div style="text-align:center;color:var(--tx3);font-size:8px;padding:8px;opacity:.4">Aucune</div>'}

function rAbs(){const dates=wkd(weekOff);const dn=['LUN','MAR','MER','JEU','VEN'];const team=gTeam(dates);let h=`<div class="abs-grid" style="grid-template-columns:100px repeat(5,1fr)"><div class="abs-h" style="font-size:7px;display:flex;align-items:center;justify-content:center">👥 Équipe</div>`;dates.forEach((d,i)=>{const dd=new Date(d+'T12:00:00');h+=`<div class="abs-h${isT(d)?' today':''}">${dn[i]} <span style="font-size:10px;font-weight:800">${dd.getDate()}</span><span style="font-size:6px;opacity:.5">/${dd.getMonth()+1}</span></div>`});team.forEach(p=>{h+=`<div class="abs-nm"><div class="av ${avC(p)}" style="width:18px;height:18px;font-size:7px">${p.ini}</div><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span></div>`;dates.forEach(d=>{const ab=iA(p.name,d);h+=`<div class="abs-cl">${ab?`<span class="abs-tag ${ABC[ab.type]||'abs-o'}">${AL[ab.type]}</span>`:''}</div>`})});h+='</div>';h+='<div style="margin-top:10px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:12px;box-shadow:var(--shadow)"><div class="sc-t">📅 Liste des absences</div>';const sa=[...absences].sort((a,b)=>(a.start||'').localeCompare(b.start||''));if(sa.length)sa.forEach(a=>{const s=fmtDS(a.start),e=fmtDS(a.end),days=Math.round((new Date(a.end)-new Date(a.start))/864e5)+1;h+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bdr)"><span class="abs-tag ${ABC[a.type]||'abs-o'}" style="min-width:80px;text-align:center;flex-shrink:0">${AL[a.type]}</span><b style="font-size:10px;min-width:60px;flex-shrink:0">${a.who}</b><span style="font-size:8px;color:var(--tx3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s} → ${e} (${days}j)${a.note?' · '+a.note:''}</span><button class="btn btn-d" style="padding:2px 6px;font-size:7px;flex-shrink:0" data-adel="${a.fbId}">✕</button></div>`});else h+='<div style="text-align:center;color:var(--tx3);font-size:9px;padding:10px;opacity:.4">Aucune</div>';h+='</div>';document.getElementById('absCal').innerHTML=h;document.querySelectorAll('[data-adel]').forEach(b=>{b.addEventListener('click',function(){delA(this.dataset.adel)})})}

function rKb(){const w=wkd(weekOff);const seen=new Set();const allT=[];w.forEach(d=>{tasks.forEach(t=>{if(tOn(t,d)&&!seen.has(t.fbId)&&matchesFilters(t)){seen.add(t.fbId);allT.push(t)}})});document.getElementById('kboard').innerHTML=SF.map(s=>{const st=allT.filter(t=>t.sta===s);const bc=s==='Terminé'?'var(--green)':s==='En cours'?'var(--navy)':'var(--violet)';return`<div><div style="font-size:9px;font-weight:700;color:var(--tx2);margin-bottom:8px;padding-bottom:5px;border-bottom:2px solid ${bc}">${SI[s]} ${s} (${st.length})</div>${st.map(t=>{const dd=isMD(t)?fmtDS(t.date)+' → '+fmtDS(t.dateEnd):fmtDS(t.date);const dH=t.sta==='Terminé'&&t.doneDate?`<span class="kb-done-date">✅ ${fmtDS(t.doneDate)}</span>`:'';return`<div style="background:var(--card);border:1px solid var(--bdr);border-radius:6px;padding:8px;margin-bottom:4px;box-shadow:var(--shadow)${isL(t)?';border-left:3px solid var(--green)':''}"><div style="display:flex;justify-content:space-between;align-items:center"><span class="wg-cli ${cliCls(t.cli)}" style="font-size:7px">${t.cli}</span><div style="display:flex;gap:2px;align-items:center"><span class="kb-date">${dd}</span><button class="wg-dup" data-kdupid="${t.fbId}">⧉</button><button class="wg-del" data-kdel="${t.fbId}">✕</button></div></div><div style="font-size:9px;font-weight:700;margin:3px 0">${isL(t)?'🚀 ':''}${t.proj}</div><div style="display:flex;justify-content:space-between;align-items:center;gap:4px"><span style="font-size:6px;color:var(--tx3)">${t.who} · ${t.typ}${t.pp?' · 📋'+t.pp:''}</span><div style="display:flex;gap:3px;align-items:center">${dH}<button class="sb ${SB[t.sta]}" data-kid="${t.fbId}">${SI[t.sta]}</button></div></div></div>`}).join('')}</div>`}).join('');document.querySelectorAll('[data-kid]').forEach(b=>{b.addEventListener('click',function(){cyc(this.dataset.kid)})});document.querySelectorAll('[data-kdel]').forEach(b=>{b.addEventListener('click',function(){delT(this.dataset.kdel)})});document.querySelectorAll('[data-kdupid]').forEach(b=>{b.addEventListener('click',function(){dupT(this.dataset.kdupid)})})}

// ═══ SALLE (uses room data) ═══
function rS(){const n=new Date();const dayN=n.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const td=tasks.filter(t=>tOn(t,D())&&t.sta!=='Terminé');const team=gTeam([D()]);const dayR=roomData[D()]||{};const rN=salleP==='regiea'?'Régie A':'Régie B';
  // Filter people for this room
  let roomPeople=[];
  if(salleP==='regiea'){roomPeople=[dayR.regieA].filter(Boolean)}
  else{roomPeople=[dayR.regieB_p1,dayR.regieB_p2,dayR.regieB_p3].filter(Boolean)}
  if(!roomPeople.length){const aN=[...new Set(td.map(t=>t.who))];roomPeople=aN}
  let cards='';roomPeople.forEach(name=>{const p=team.find(x=>x.name===name);if(!p)return;const pt=td.filter(t=>t.who===name);const pct=dP(name,D());const cc=cCol(pct);const tH=pt.length?'<div class="s-tasks">'+pt.map(t=>`<div class="s-tk"><div class="s-tk-slot">${isMD(t)?'J'+tDN(t,D())+'/'+tD(t):t.slot||'Journée'}</div><div class="s-tk-proj">${isL(t)?'🚀 ':''}${t.cli} — ${t.proj}</div><div class="s-tk-sta ${SB[t.sta]}">${SI[t.sta]}</div></div>`).join('')+'</div>':'<div class="s-empty">Libre</div>';cards+=`<div class="s-person"><div class="s-ph"><div class="s-av" style="background:${avBg(p)}">${p.ini}</div><div><div class="s-pn">${p.name}</div><div class="s-pr">${p.role}</div></div><div class="s-cap"><div class="s-cap-pct" style="color:${cc}">${pct}%</div><div class="s-cap-bar"><div class="s-cap-fill" style="width:${Math.min(pct,120)}%;background:${cc}"></div></div></div></div>${tH}</div>`});if(!cards)cards=`<div class="s-empty">Aucune affectation</div>`;
  document.getElementById('vSalle').innerHTML=`<div class="s-hdr"><div><img class="logo-img" src="https://www.wppproduction.com/themes/custom/hogarth/images/wpp-production-logo.svg" style="height:18px" onerror="this.outerHTML='<b>WPP Production</b>'"><div class="s-date">${dayN}</div></div><div class="s-room"><span class="s-dot" style="background:var(--navy)"></span>${rN}</div><div class="s-clk" id="sClk">${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}</div></div><div class="s-body">${cards}</div><div class="s-footer"><div><span class="sync-dot"></span> Temps réel</div><div>${roomPeople.length} poste${roomPeople.length>1?'s':''}</div></div>`}

function copyWeek(){const src=wkd(weekOff),dst=wkd(weekOff+1);const srcT=tasks.filter(t=>src.some(d=>t.date===d));if(!srcT.length){toast('⚠️','Aucune');return}let c=0;srcT.forEach(t=>{const i=src.indexOf(t.date);if(i===-1)return;const nd=dst[i];if(!nd)return;const{fbId,...d}=t;d.date=nd;if(d.dateEnd){const diff=Math.round((new Date(d.dateEnd)-new Date(t.date))/864e5);d.dateEnd=new Date(new Date(nd+'T12:00:00').getTime()+diff*864e5).toISOString().split('T')[0]}d.sta='En cours';d.doneDate=null;tRef.push(d);c++});toast('📋',c+' copiées → S'+wn(dst[0]))}
function exportCSV(){const w=wkd(weekOff);const rows=[['Projet','Client','Assigné','Post-Prod','Type','Statut','Date','Date Fin','Créneau','Priorité','Notes','Date terminé']];tasks.filter(t=>w.some(d=>tOn(t,d))).forEach(t=>{rows.push([t.proj,t.cli,t.who,t.pp||'',t.typ,t.sta,t.date,t.dateEnd||'',t.slot,t.pri,t.note||'',t.doneDate||''])});const csv=rows.map(r=>r.map(c=>'"'+(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='planning_S'+wn(w[0])+'.csv';a.click();toast('📥','CSV')}
function toggleTheme(){const b=document.body;const isDark=b.getAttribute('data-theme')==='dark';b.setAttribute('data-theme',isDark?'light':'dark');document.getElementById('themeBtn').textContent=isDark?'🌙':'☀️';localStorage.setItem('wpp-theme',isDark?'light':'dark')}

// ═══ TASK MODAL ═══
function updSH(){const d1=document.getElementById('fDat').value,d2=document.getElementById('fDatEnd').value,h=document.getElementById('slotHint'),s=document.getElementById('fSlo');if(d2&&d2>d1){h.textContent='📅 Multi-jours → 100%/jour';h.style.color='var(--navy)';s.disabled=true;s.value='Journée'}else{h.textContent='';s.disabled=false}}
function chkCap(){const w=document.getElementById('fAss').value,d=document.getElementById('fDat').value,de=document.getElementById('fDatEnd').value,s=document.getElementById('fSlo').value;if(!w||!d)return;const im=de&&de>d;const tot=Math.round((dL(w,d,editId)+(im?8:sH(s)))/DAY_H*100);const el=document.getElementById('capWarn');if(tot>MAX_P){el.className='cap-warn blocked';el.textContent=`🔴 BLOQUÉ — ${w} à ${tot}%`;el.style.display='block'}else if(tot>100){el.className='cap-warn over';el.textContent=`⚠️ ${w} à ${tot}%`;el.style.display='block'}else el.style.display='none'}
function openMo(id){editId=id||null;popAss();popPP();updCL();document.getElementById('modal').classList.add('on');document.getElementById('moTitle').textContent=id?'✏️ Modifier':'✨ Nouvelle Tâche';document.getElementById('moDelBtn').style.display=id?'flex':'none';document.getElementById('capWarn').style.display='none';document.getElementById('fSlo').disabled=false;if(id){const t=tasks.find(x=>x.fbId===id);if(!t)return;document.getElementById('fProj').value=t.proj||'';document.getElementById('fCli').value=t.cli||'';document.getElementById('fAss').value=t.who||'';document.getElementById('fPP').value=t.pp||'';document.getElementById('fTyp').value=t.typ||'Motion';document.getElementById('fSta').value=t.sta||'En cours';document.getElementById('fDat').value=t.date||D();document.getElementById('fDatEnd').value=t.dateEnd||'';document.getElementById('fSlo').value=t.slot||'Journée';document.getElementById('fPri').value=t.pri||'Normal';document.getElementById('fNot').value=t.note||''}else{document.getElementById('fProj').value='';document.getElementById('fCli').value='';document.getElementById('fDat').value=D();document.getElementById('fDatEnd').value='';document.getElementById('fSta').value='En cours';document.getElementById('fPri').value='Normal';document.getElementById('fPP').value='';document.getElementById('fNot').value='';document.getElementById('fSlo').value='Journée'}setTimeout(()=>{updSH();chkCap()},50)}
function closeMo(){document.getElementById('modal').classList.remove('on');editId=null}
function saveMo(){const proj=document.getElementById('fProj').value.trim();if(!proj){toast('⚠️','Projet requis');return}const who=document.getElementById('fAss').value,date=document.getElementById('fDat').value,dateEnd=document.getElementById('fDatEnd').value||'',cli=document.getElementById('fCli').value.trim()||'Autre';const im=dateEnd&&dateEnd>date;const slot=im?'Journée':document.getElementById('fSlo').value;const tot=Math.round((dL(who,date,editId)+(im?8:sH(slot)))/DAY_H*100);if(tot>MAX_P){toast('🔴',`Bloqué: ${who} à ${tot}%`);return}if(im){let d=new Date(date);while(d<=new Date(dateEnd)){if(iA(who,d.toISOString().split('T')[0])){toast('⚠️',who+' absent');return}d.setDate(d.getDate()+1)}}else if(iA(who,date)){toast('⚠️',who+' absent');return}const sta=document.getElementById('fSta').value;const data={proj,cli,who,pp:document.getElementById('fPP').value,typ:document.getElementById('fTyp').value,sta,date,dateEnd:dateEnd||null,slot,pri:document.getElementById('fPri').value,note:document.getElementById('fNot').value,doneDate:sta==='Terminé'?D():null};if(editId)updT(editId,data);else addT(data);closeMo()}
['fAss','fDat','fDatEnd','fSlo'].forEach(id=>{document.getElementById(id).addEventListener('change',function(){updSH();chkCap()})});

// ═══ GRAPHISTE MODAL ═══
function openFreeMo(){document.getElementById('freeModal').classList.add('on');document.getElementById('frName').value='';document.getElementById('frIni').value='';document.getElementById('frRole').value='Graphiste';document.getElementById('frPerm').checked=false;document.getElementById('frDatesRow').style.display='';document.getElementById('frStart').value=D();document.getElementById('frEnd').value='';const gF=freelances.filter(f=>(f.category||'graphiste')==='graphiste');const u=[...new Map(gF.map(f=>[f.name,f])).values()];document.getElementById('recallList').innerHTML=u.length?u.map(f=>`<div class="recall-item" data-rn="${f.name}" data-ri="${f.ini}" data-rr="${f.role||'Graphiste'}"><span>👤</span><span style="font-weight:700;flex:1">${f.name}</span><span style="font-size:7px;color:var(--tx3)">${f.role||'Graphiste'}</span></div>`).join(''):'<div style="font-size:8px;color:var(--tx3)">Aucun</div>';document.querySelectorAll('#recallList .recall-item').forEach(el=>{el.addEventListener('click',function(){document.getElementById('frName').value=this.dataset.rn;document.getElementById('frIni').value=this.dataset.ri;document.getElementById('frRole').value=this.dataset.rr;toast('👤','Rappelé')})});rGTeamList()}
function rGTeamList(){const team=gTeam();const nf=team.filter(p=>!p.fixed);document.getElementById('gTeamList').innerHTML=nf.length?nf.map(p=>{const f=freelances.find(x=>x.name===p.name&&(x.category||'graphiste')==='graphiste');const dates=isPerm(f)?'<span class="perm-badge">PERMANENT</span>':`<span class="team-dates">${fmtDS(f.startDate)} → ${fmtDS(f.endDate)}</span>`;return`<div class="team-item"><div class="team-av" style="background:linear-gradient(135deg,#4338CA,#6d28d9)">${p.ini}</div><div class="team-info"><div class="team-name">${p.name}</div><div class="team-role">${p.role} ${dates}</div></div><button class="team-del" data-fdel="${f.fbId}">✕</button></div>`}).join(''):'<div style="font-size:8px;color:var(--tx3);text-align:center;padding:4px">Aucun ajouté</div>';document.querySelectorAll('#gTeamList .team-del').forEach(b=>{b.addEventListener('click',function(){delFree(this.dataset.fdel);setTimeout(rGTeamList,500)})})}
function closeFreeMo(){document.getElementById('freeModal').classList.remove('on')}
function saveFreeG(){const name=document.getElementById('frName').value.trim(),ini=document.getElementById('frIni').value.trim().toUpperCase(),role=document.getElementById('frRole').value.trim()||'Graphiste';const perm=document.getElementById('frPerm').checked;const startDate=perm?D():document.getElementById('frStart').value;const endDate=perm?PERM_END:document.getElementById('frEnd').value;if(!name||!ini){toast('⚠️','Nom et initiales requis');return}if(!perm&&(!startDate||!endDate)){toast('⚠️','Dates requises');return}fRef.push({name,ini,role,startDate,endDate,type:'f',category:'graphiste',permanent:perm});toast('👤',name+(perm?' (permanent)':' ajouté'));setTimeout(()=>{rGTeamList();popAss()},500);document.getElementById('frName').value='';document.getElementById('frIni').value=''}

// ═══ POST-PROD MODAL ═══
function openPPMo(){document.getElementById('ppModal').classList.add('on');document.getElementById('ppName').value='';document.getElementById('ppIni').value='';document.getElementById('ppPerm').checked=false;document.getElementById('ppDatesRow').style.display='';document.getElementById('ppStart').value=D();document.getElementById('ppEnd').value='';const ppF=freelances.filter(f=>f.category==='postprod');const u=[...new Map(ppF.map(f=>[f.name,f])).values()];document.getElementById('ppRecallList').innerHTML=u.length?u.map(f=>`<div class="recall-item" data-rn="${f.name}" data-ri="${f.ini||f.name[0]}"><span>📋</span><span style="font-weight:700;flex:1">${f.name}</span><span style="font-size:7px;color:var(--tx3)">${isPerm(f)?'Permanent':'Temp'}</span></div>`).join(''):'<div style="font-size:8px;color:var(--tx3)">Aucun</div>';document.querySelectorAll('#ppRecallList .recall-item').forEach(el=>{el.addEventListener('click',function(){document.getElementById('ppName').value=this.dataset.rn;document.getElementById('ppIni').value=this.dataset.ri;toast('📋','Rappelé·e')})});rPPTeamList()}
function rPPTeamList(){const ppF=freelances.filter(f=>f.category==='postprod');const all=[...PP_FIXED.map(p=>({...p,fbId:null})),...ppF];document.getElementById('ppTeamList').innerHTML=all.map(p=>{const isFixed=p.fixed;const perm=isFixed||isPerm(p);const badge=isFixed?'<span style="font-size:5px;color:var(--tx3)">FIXE</span>':perm?'<span class="perm-badge">PERMANENT</span>':`<span class="team-dates">${fmtDS(p.startDate)} → ${fmtDS(p.endDate)}</span>`;const delBtn=isFixed?'':`<button class="team-del" data-ppdel="${p.fbId}">✕</button>`;return`<div class="team-item"><div class="team-av" style="background:linear-gradient(135deg,#0891b2,#06b6d4)">${p.ini||p.name[0]}</div><div class="team-info"><div class="team-name">${p.name}</div><div class="team-role">Post-Prod ${badge}</div></div>${delBtn}</div>`}).join('');document.querySelectorAll('#ppTeamList .team-del').forEach(b=>{b.addEventListener('click',function(){delFree(this.dataset.ppdel);setTimeout(()=>{rPPTeamList();popPP()},500)})})}
function closePPMo(){document.getElementById('ppModal').classList.remove('on')}
function savePP(){const name=document.getElementById('ppName').value.trim(),ini=document.getElementById('ppIni').value.trim().toUpperCase();const perm=document.getElementById('ppPerm').checked;const startDate=perm?D():document.getElementById('ppStart').value;const endDate=perm?PERM_END:document.getElementById('ppEnd').value;if(!name||!ini){toast('⚠️','Nom et initiales requis');return}if(!perm&&(!startDate||!endDate)){toast('⚠️','Dates requises');return}fRef.push({name,ini,role:'Post-Prod',startDate,endDate,type:'pp',category:'postprod',permanent:perm});toast('📋',name+(perm?' (permanent)':' ajouté·e'));setTimeout(()=>{rPPTeamList();popPP()},500);document.getElementById('ppName').value='';document.getElementById('ppIni').value=''}

document.getElementById('frPerm').addEventListener('change',function(){document.getElementById('frDatesRow').style.display=this.checked?'none':''});
document.getElementById('ppPerm').addEventListener('change',function(){document.getElementById('ppDatesRow').style.display=this.checked?'none':''});
function openAbsMo(){popAss();document.getElementById('absModal').classList.add('on');document.getElementById('aStart').value=D();document.getElementById('aEnd').value=D();document.getElementById('aNote').value=''}
function closeAbsMo(){document.getElementById('absModal').classList.remove('on')}
function saveAbsMo(){const who=document.getElementById('aPer').value,type=document.getElementById('aTyp').value,start=document.getElementById('aStart').value,end=document.getElementById('aEnd').value,note=document.getElementById('aNote').value;if(!start||!end||end<start){toast('⚠️','Dates invalides');return}addA({who,type,start,end,note});closeAbsMo()}
function switchView(v){curView=v;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));const b=document.querySelector(`.tab[data-v="${v}"]`);if(b)b.classList.add('on');['vPlan','vAbs','vKan'].forEach(id=>document.getElementById(id).classList.remove('on'));document.getElementById('vSalle').classList.remove('on');document.getElementById('hdr').style.display='';if(v==='planning'){document.getElementById('vPlan').classList.add('on');render()}else if(v==='absences'){document.getElementById('vAbs').classList.add('on');rAbs()}else if(v==='kanban'){document.getElementById('vKan').classList.add('on');rKb()}}

document.addEventListener('click',function(e){if(openDropSlot&&!e.target.closest('.rp[data-rslot]')&&!e.target.closest('.room-dd')){openDropSlot=null;rRm()}});
