}

function updModalHints(){var d1=$('mD1').value,d2=$('mD2').value;if(d2&&d2>d1){$('sloH').textContent='📅 Multi-jours';$('mSlo').disabled=true;$('mSlo').value='Journée'}else{$('sloH').textContent='';$('mSlo').disabled=false}var who=$('mWho').value,d=$('mD1').value,de=$('mD2').value,s=$('mSlo').value;if(!who||!d){$('capW').style.display='none';return}var im=de&&de>d;var tot=Math.round((dL(who,d,D.editId)+(im?8:sHr(s)))/DH*100);if(tot>MXP){$('capW').className='cap-w cw-block';$('capW').textContent='🔴 Bloqué — '+who+' à '+tot+'%';$('capW').style.display='block'}else if(tot>100){$('capW').className='cap-w cw-warn';$('capW').textContent='⚠️ '+who+' à '+tot+'%';$('capW').style.display='block'}else $('capW').style.display='none'}

function saveTask(){var proj=$('mProj').value.trim();if(!proj)return toast('⚠️','Projet requis');var who=$('mWho').value,d1=$('mD1').value,d2=$('mD2').value||'',cli=$('mCli').value.trim()||'Autre';var im=d2&&d2>d1,slot=im?'Journée':$('mSlo').value;var tot=Math.round((dL(who,d1,D.editId)+(im?8:sHr(slot)))/DH*100);if(tot>MXP)return toast('🔴','Capacité max');if(hAR(who,d1,d2||d1))return toast('⚠️',who+' absent');var sta=$('mSta').value;var data={proj:proj,cli:cli,who:who,pp:$('mPP').value||null,typ:$('mTyp').value,sta:sta,date:d1,dateEnd:d2||null,slot:slot,pri:$('mPri').value,note:$('mNot').value||null,doneDate:sta==='Terminé'?td():null};if(D.editId)uT(D.editId,data);else aT(data);closeTask()}

function saveFree(){var name=$('fN').value.trim(),ini=($('fI').value.trim()||aI(name)).toUpperCase(),role=$('fR').value.trim()||'Graphiste',perm=$('fPerm').checked;var sd=perm?td():$('fSD').value,ed=perm?END:$('fED').value;if(!name)return toast('⚠️','Nom requis');if(!perm&&(!sd||!ed))return toast('⚠️','Dates');if(!perm&&ed<sd)return toast('⚠️','Fin<Début');var ex=D.free.filter(function(f){return f.name===name&&(f.category||'graphiste')==='graphiste'});if(ex.length){var minS=sd,maxE=ed;ex.forEach(function(f){if((f.startDate||'9')<minS)minS=f.startDate;if((f.endDate||'')>maxE)maxE=f.endDate});if(perm){minS=td();maxE=END}R.f.child(ex[0].fbId).update({name:name,ini:ini,role:role,startDate:minS,endDate:maxE,permanent:perm,type:'f',category:'graphiste'});for(var i=1;i<ex.length;i++)R.f.child(ex[i].fbId).remove();toast('👤','MàJ')}else{R.f.push({name:name,ini:ini,role:role,startDate:sd,endDate:ed,type:'f',category:'graphiste',permanent:perm});toast('👤','Ajouté')}$('fN').value='';$('fI').value='';$('fNH').textContent='';setTimeout(pS,500)}
function savePP(){var name=$('pN').value.trim(),ini=($('pI').value.trim()||aI(name)).toUpperCase(),perm=$('pPerm').checked;var sd=perm?td():$('pSD').value,ed=perm?END:$('pED').value;if(!name)return toast('⚠️','Nom requis');if(!perm&&(!sd||!ed))return toast('⚠️','Dates');var ex=D.free.filter(function(f){return f.name===name&&f.category==='postprod'});if(ex.length){var minS=sd,maxE=ed;ex.forEach(function(f){if((f.startDate||'9')<minS)minS=f.startDate;if((f.endDate||'')>maxE)maxE=f.endDate});if(perm){minS=td();maxE=END}R.f.child(ex[0].fbId).update({name:name,ini:ini,startDate:minS,endDate:maxE,permanent:perm,type:'pp',category:'postprod'});for(var i=1;i<ex.length;i++)R.f.child(ex[i].fbId).remove();toast('📋','MàJ')}else{R.f.push({name:name,ini:ini,role:'Post-Prod',startDate:sd,endDate:ed,type:'pp',category:'postprod',permanent:perm});toast('📋','Ajouté')}$('pN').value='';$('pI').value='';$('pNH').textContent='';setTimeout(pS,500)}
